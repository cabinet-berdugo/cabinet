<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabinet Berdugo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cabinet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<meta name="theme-color" content="#061B42">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F1F5FB; --card:#FFFFFF; --line:#DCE5F2; --line2:#C3D1E6;
  --ink:#0B1736; --ink2:#55657F; --ink3:#7C8AA5;
  --acc:#0047D9; --acc2:#123B82; --accbg:#E8EFFE;
  --red:#b42318; --redbg:#fdecea; --amb:#8a5a00; --ambbg:#fdf3dc;
  --grn:#1d6b38; --grnbg:#e5f4e9; --blu:#1f5c99; --blubg:#e6eff9;
  --r:10px; --nav:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.hidden{display:none!important}

/* En-tête */
.nvadr{max-width:1120px;margin:10px auto 0;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ambbg);color:var(--amb);border-radius:10px;font-size:14px;font-weight:500}
@supports (padding:env(safe-area-inset-top)){header{padding-top:env(safe-area-inset-top)}}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;position:relative}
.tab:hover{background:var(--bg)}
.tab.on{background:var(--accbg);color:var(--acc2)}
.cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;text-align:center;margin-left:6px;vertical-align:1px}
.who{margin-left:auto;text-align:right;font-size:13px;color:var(--ink2);line-height:1.25}
.who b{display:block;color:var(--ink);font-weight:600}

/* Navigation mobile */
.bnav{display:none}
@media (max-width:760px){
  .tabs,.who{display:none}
  .hd{padding:10px 16px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{flex:1;border:0;background:none;padding:8px 0 10px;color:var(--ink3);font-size:12px;font-weight:500;position:relative}
  .bnav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
  .bnav button.on{color:var(--acc)}
  .bnav .cnt{position:absolute;top:4px;left:50%;margin-left:6px}
  main{padding-bottom:calc(var(--nav) + 24px)!important}
  .me-m{display:block!important}
}
.me-m{display:none;font-size:13px;color:var(--ink2)}

main{max-width:1120px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:4px 0 16px;letter-spacing:-.02em}
h2{font-size:16px;margin:24px 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2)}
.btn.ok{background:var(--grnbg);border-color:#b9dfc4;color:var(--grn)}
.btn.ko{background:var(--card);border-color:#f0c2bc;color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.lk{border:0;background:none;color:var(--acc);cursor:pointer;padding:0;font-weight:500}

/* Compteurs */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--line2)}
.stat.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.stat small{display:block;color:var(--ink2);font-size:12.5px}
.stat b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.stat.r b{color:var(--red)}
@media (max-width:760px){
  main{padding:14px}
  h1{font-size:20px}
  .stats{display:flex;overflow-x:auto;gap:8px;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto;min-width:92px;padding:8px 12px}
  .stat b{font-size:19px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters .seg,.filters input{grid-column:1/-1;min-width:0}
  .filters .seg{display:flex;width:100%}.filters .seg button{flex:1;padding:8px 6px;white-space:nowrap}
  .filters select{width:100%;font-size:14px;padding:7px 8px}
  .filters #fResp{grid-column:1/-1}
  .filters select{display:none}
  .filters.open select{display:block}
  .filters #fTog{display:flex;grid-column:1/-1;justify-content:center}
  .kv{grid-template-columns:100px 1fr}
}

/* Filtres */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 10px;max-width:100%}
.filters input{min-width:180px;flex:1}
#fTog{display:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--accbg);color:var(--acc2)}

/* Cartes de tâches */
.list{display:flex;flex-direction:column;gap:8px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.tc:hover{border-color:var(--line2)}
.tc.late{border-left:4px solid var(--red);padding-left:11px}
.tc .bd{flex:1;min-width:0}
.tc .tt{font-weight:600;display:flex;align-items:center;gap:8px}
.tc .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blu);flex:none}
.meta{color:var(--ink2);font-size:13px;margin-top:2px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.p-todo{background:#F1F5F9;color:#475569}
.p-cours{background:#fdebd6;color:#a14a00}
.p-att{background:var(--ambbg);color:var(--amb)}
.p-fin{background:var(--grnbg);color:var(--grn)}
.p-late,.p-urg{background:var(--redbg);color:var(--red)}
.p-haute{background:var(--ambbg);color:var(--amb)}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink2)}

/* Tiroir / panneau */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.08)}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-h b{font-size:16px}
.dr-b{flex:1;min-height:0;overflow:auto;padding:18px;-webkit-overflow-scrolling:touch}
.x{margin-left:auto;border:0;background:var(--bg);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1;color:var(--ink2)}
.dtitle{font-size:20px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;padding:12px;background:var(--bg);border-radius:var(--r)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin:14px 0}
.kv dt{color:var(--ink2)}
.kv dd{margin:0}
.desc{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;margin:10px 0;font-size:14.5px}
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:22px 0 8px}
.ppl{display:flex;flex-direction:column;gap:4px;font-size:14px}
.ppl div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.ok-t{color:var(--grn);font-size:13px}
.no-t{color:var(--ink3);font-size:13px}
.com{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.com small{color:var(--ink3)}
.com p{margin:3px 0 0;white-space:pre-wrap}
.hist{font-size:13px;color:var(--ink2)}
.hist div{padding:4px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;font-size:12.5px}
.thumbs img{display:block;width:96px;height:96px;object-fit:cover;background:var(--bg)}
.thumbs .f{padding:10px 12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Formulaires */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink2)}
.fld input[type=text],.fld input[type=email],.fld input[type=password],.fld input[type=date],.fld input[type=time],.fld input[type=url],.fld select,.fld textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;background:var(--card)}
.fld textarea{min-height:90px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.filters input:focus,.filters select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.g{font-weight:600}
.hint{font-size:12.5px;color:var(--ink3);margin-top:4px}
.err{color:var(--red);font-size:13px;margin-top:6px}
.dr-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;padding-bottom:calc(12px + env(safe-area-inset-bottom))}

/* Planning */
.wk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wk .nm{font-weight:600;min-width:200px;text-align:center}
.grid{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table.pl{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.pl th,.pl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top}
.pl th{background:#F8FAFC;padding:8px;text-align:left;font-weight:600;font-size:12.5px;color:var(--ink2)}
.pl th.td{color:var(--acc2);background:var(--accbg)}
.pl td.nm{padding:10px;font-weight:600;white-space:nowrap;background:#F8FAFC;width:140px}
.pl tr.me td.nm{color:var(--acc2)}
.cell{min-height:58px;padding:8px;display:block;width:100%;border:0;background:none;text-align:left;cursor:default}
.ed .cell{cursor:pointer}
.ed .cell:hover{background:#F5F8FC}
.cell .h{font-weight:600}
.cell .a{color:var(--ink2);font-size:12px}
.cell .s{color:var(--amb);font-size:12px}
.cell.rep{color:var(--ink3);background:repeating-linear-gradient(-45deg,#F8FAFC,#F8FAFC 6px,#F1F4F8 6px,#F1F4F8 12px)}
.cell.cg{background:var(--ambbg);color:var(--amb);font-weight:600}
.cell .plus{color:var(--line2);font-size:20px}
.days{display:flex;flex-direction:column;gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:14px;align-items:center}
.day.td{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.day .d{width:86px;flex:none}
.day .d b{display:block}
.day .d small{color:var(--ink3)}
.day .c{flex:1}
.day .c .h{font-weight:600;font-size:16px}
.day.rep{background:#F8FAFC;color:var(--ink3)}
.day.cg{background:var(--ambbg)}

/* Boutons de statut sur les bandeaux */
.stb{display:flex;gap:6px;flex:none;align-items:center}
.sbtn{border:1.5px solid var(--line2);border-radius:9px;padding:0 14px;min-height:40px;font-weight:600;font-size:14px;background:var(--card);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.sbtn.c{border-color:#f3c08a;color:#a14a00}
.sbtn.c:hover{background:#fff6ec}
.sbtn.c.on{background:#e8830f;border-color:#e8830f;color:#fff}
.sbtn.f{border-color:#a8d8b6;color:var(--grn)}
.sbtn.f:hover{background:#f0f9f3}
.sbtn.f.on{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.sbtn:disabled{opacity:.6}
.sbtn.sm{min-height:32px;padding:0 10px;font-size:12.5px}
.tc.st-todo{border-left:4px solid #b9c0c4;padding-left:11px}
.tc.st-cours{border-left:4px solid #e8830f;padding-left:11px}
.tc.st-fin{border-left:4px solid #1f8a4c;padding-left:11px;opacity:.85}
.p-haute{background:var(--redbg);color:var(--red);font-weight:600}
.mine{font-size:12px;color:var(--ink2);margin-top:4px}
@media (max-width:760px){
  .tc{flex-direction:column;gap:10px;align-items:stretch}
  .tc .bd{width:100%}
  .stb{width:100%}
  .stb .sbtn{flex:1;min-height:44px;font-size:15px}
  .pr .stb{width:auto}
  .pr .stb .sbtn{min-height:34px;font-size:13px;flex:none}
}
.ma{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0;padding:12px;background:var(--bg);border-radius:var(--r)}
.ma b{font-size:13px;color:var(--ink2);margin-right:4px}
.pr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pr .n{font-weight:600;min-width:90px}
.pr .d{color:var(--ink3);font-size:12.5px;flex:1;min-width:120px}
/* Cloche */
.bell{position:relative;border:0;background:none;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--ink2);display:grid;place-items:center;flex:none}
.bell:hover{background:var(--bg)}
.bell svg{width:22px;height:22px}
.bell .cnt{position:absolute;top:3px;right:1px;margin:0}
.who{margin-left:0}
.hd .sp{flex:1}
.nt{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.nt:hover{background:#F8FAFC}
.nt .dot{margin-top:6px;visibility:hidden}
.nt.nl .dot{visibility:visible}
.nt.nl b{color:var(--ink)}
.nt b{display:block;font-size:14px;color:var(--ink2)}
.nt span{font-size:13.5px;color:var(--ink2)}
.nt small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
.alerte-n{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:65;background:var(--card);border:1px solid var(--line2);border-left:5px solid var(--acc);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 16px;width:min(440px,calc(100% - 24px));cursor:pointer;font-size:14px;animation:aN .25s ease-out}
.alerte-n.h{border-left-color:var(--red)}
.alerte-n b{display:block}
@keyframes aN{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.cfg{background:var(--bg);border-radius:10px;padding:12px 14px;margin:8px 0 12px;font-size:14px}
.cfg ol{margin:6px 0 0;padding-left:20px}
.cfg li{margin-bottom:8px}
.code-n{display:flex;gap:6px;margin-top:6px}
.code-n input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border-radius:14px;padding:20px;width:min(380px,100%)}
/* Sélecteur de personnes */
.selp{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--card)}
.selp-h{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:#F8FAFC}
.selp-q{flex:1;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:15px}
.selp-n{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.selp-l{max-height:300px;overflow:auto;padding:4px 0}
.selp-g{padding:4px 0}
.selp-gt{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 2px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.selp-gt .lk{font-size:12.5px;text-transform:none;letter-spacing:0}
.selp-i{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer;font-size:14.5px}
.selp-i:hover{background:#F8FAFC}
.selp-i input{width:18px;height:18px;accent-color:var(--acc);flex:none}
.selp-i small{color:var(--ink3);font-size:12px}
.stats.st3{grid-template-columns:repeat(3,minmax(0,1fr))}
.selp-b{padding:6px 12px 10px}
.selp-g .chips{gap:8px}
.pch{border:1.5px solid var(--line2);background:var(--card);border-radius:22px;padding:0 16px;min-height:42px;cursor:pointer;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent}
.pch:hover{border-color:var(--ink3)}
.pch.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pch small{font-size:11.5px;opacity:.75;font-weight:400}
.pch.moi{border-style:dashed;border-color:var(--acc);color:var(--acc2)}
.pch.moi.on{border-style:solid;color:#fff}
.selp-s{font-size:12.5px;color:var(--ink2);padding:0 12px 8px}
/* Personnel */
.pg{margin-bottom:18px}
.pg h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:0 0 8px}
.pc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:6px;cursor:pointer}
.pc:hover{border-color:var(--line2)}
.pc.arch{opacity:.7;background:#F8FAFC}
.av{width:36px;height:36px;border-radius:50%;background:var(--accbg);color:var(--acc2);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.pc .bd{flex:1;min-width:0}
.pc .nm{font-weight:600}
.pc .mt{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.perm{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.perm input{width:18px;height:18px;accent-color:var(--acc);margin-top:1px;flex:none}
.perm small{display:block;color:var(--ink3);font-size:12px}
/* Historique personne */
.hrow{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);cursor:default}
.hrow[data-t]{cursor:pointer}
/* Affectations */
.ajd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;width:100%;text-align:left;background:var(--accbg);border:1px solid #CFDCEC;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;cursor:pointer;font-size:14px;color:var(--ink)}
.ajd-t{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--acc2)}
.ajd-l{min-width:0}
.ajd-v{margin-left:auto;color:var(--acc2);font-weight:600;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.alerte{background:var(--redbg);color:var(--red);border:1px solid #f3c9c3;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;flex-direction:column;gap:3px}
h2.etage{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:20px 0 8px}
.salles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.salles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.salles{grid-template-columns:minmax(0,1fr)}}
.salle{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px}
.libre{color:var(--ink3);font-size:13.5px;padding:6px 0}
.af{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#F8FAFC;min-width:0}
.af.ed{cursor:pointer}.af.ed:hover{border-color:var(--line2)}
.af.ed:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.af-c{border-color:#eab3ab;background:var(--redbg)}
.af-h{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:600}
.af-d{font-weight:600;font-size:15px;margin:1px 0 4px}
.af-a{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13.5px}
.af-n{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:4px}
.as{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:#F1F5F9;color:#475569;white-space:nowrap}
.t-warn{background:var(--ambbg);color:var(--amb)}
.t-info{background:var(--blubg);color:var(--blu)}
.pb{font-size:12.5px;margin-top:5px;line-height:1.35}
.pb-c{color:var(--red)}.pb-a{color:var(--amb)}
.auj{background:var(--accbg);border:1px solid #CFDCEC;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.auj-t{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--acc2);margin-bottom:6px}
.auj-l{display:flex;flex-direction:column;gap:1px;padding:4px 0}
.auj-l .big{font-size:19px;font-weight:600;color:var(--ink)}
.mi{display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.mi:first-child{border-top:0}
.mi-h{width:96px;flex:none;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.indep{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.indep input{flex:1;min-width:160px;border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.chip small{color:inherit;opacity:.8;font-size:11.5px}
.chip.ext{display:inline-flex;align-items:center;gap:6px;cursor:default}
.x-ext{border:0;background:rgba(255,255,255,.25);color:inherit;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1;font-size:14px}
.slr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.slf{display:flex;gap:8px;flex:1;min-width:220px}
.slf input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.slb{display:flex;gap:6px;align-items:center}
.chk2{font-size:13px;color:var(--ink2);display:flex;gap:4px;align-items:center;margin-right:4px}
@media (max-width:760px){.day{align-items:flex-start}.day .d{width:74px}.mi{flex-direction:column;gap:2px}.mi-h{width:auto}#plSeg{width:100%;display:flex}#plSeg button{flex:1;padding:8px 4px;font-size:13.5px}}
/* Congés */
.cg-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.cg-c .t{font-weight:600}
.cg-c .m{color:var(--ink2);font-size:13px}
.cg-c .r{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.trc{flex-basis:100%;font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:2px}
.trc .no{color:var(--red);font-weight:600}
.trc .ok{color:var(--grn)}
.cg-c .trc{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.cg-c details{margin-top:6px;font-size:12.5px;color:var(--ink2)}
.cg-c summary{cursor:pointer;color:var(--acc);font-weight:600}
/* Matériel */
.mq{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 13px;font-size:16px;background:var(--card);margin-bottom:12px}
.mq:focus{outline:2px solid var(--acc);outline-offset:-1px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.mc-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.mc-h b{font-size:15.5px;flex:1}
.mc-h .nb{color:var(--ink3);font-size:13px}
.mc-h .chev{width:18px;height:18px;color:var(--ink3);transition:transform .15s}
.mc.open .mc-h .chev{transform:rotate(90deg)}
.mc-b{border-top:1px solid var(--line)}
.ma-r{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ma-r:last-child{border-bottom:0}
.ma-r.moi{background:var(--accbg)}
.ma-t{flex:1;min-width:0}
.ma-t b{display:block;font-weight:600;font-size:14.5px}
.ma-t small{display:block;color:var(--ink3);font-size:12.5px}
.ma-o{color:var(--amb);font-size:12.5px;margin-top:2px}
.ma-k{color:var(--blu);font-size:12.5px;margin-top:2px}
.ma-e{font-size:12.5px;margin-top:2px}
.ma-r{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ma-r .cb{flex:none;width:26px;height:26px;border:2px solid var(--line2);border-radius:7px;display:grid;place-items:center;color:transparent;background:var(--card);transition:background .1s,border-color .1s}
.ma-r .cb svg{width:16px;height:16px}
.ma-r.sel{background:var(--accbg)}
.ma-r.sel .cb{background:var(--acc);border-color:var(--acc);color:#fff}
.ma-t .ch{color:var(--acc);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ms{border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--bg);padding:11px 14px 11px 22px;cursor:pointer;text-align:left;font:inherit;color:inherit;font-weight:600;font-size:14.5px}
.ms-h span:first-child{flex:1}
.ms-h .nb{color:var(--ink3);font-weight:400;font-size:13px}
.ms-h .chev{width:16px;height:16px;color:var(--ink3);transition:transform .15s}
.ms.open .ms-h .chev{transform:rotate(90deg)}
.ms-b .ma-r{padding-left:22px}
.mbar2{display:flex;gap:8px}
.mbar2 .btn{box-shadow:0 4px 14px rgba(0,0,0,.12);padding:12px;font-size:15px;justify-content:center}
.mbar2 .btn.pri{flex:1}

/* Impayés et relances */
.sv-sum{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin:2px 0 14px;color:var(--ink2);font-size:14.5px}
.sv-sum b{font-size:22px;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sv-sum b.r{color:var(--red)}
.sv-g{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px}
.sv-g h2{margin:0}
.sv-g span{color:var(--ink3);font-size:13.5px}
.sv-c{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;font:inherit;color:inherit}
.sv-c:hover{border-color:var(--line2)}
.sv-c .b{flex:1;min-width:0}
.sv-c .b b{display:block;font-size:15.5px}
.sv-c .b small{display:block;color:var(--ink2);font-size:13px;margin-top:1px}
.sv-c .b .j{color:var(--ink3);font-size:12px;margin-top:4px}
.sv-c .m{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sv-c .m.r{color:var(--red)}
.sv-c.imp{border-left:5px solid var(--red)}
.sv-rl{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.sv-man{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:#7a5b00;background:#fff4d6;border-radius:999px;padding:2px 9px}
.sv-rl span{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:#eef3f3;color:var(--ink3)}
.sv-rl span.f{background:var(--accbg);color:var(--acc2)}
.sv-rl span.a{background:var(--ambbg);color:var(--amb)}
.sv-d{background:#f2f6f6;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.sv-d div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.sv-d div span:first-child{color:var(--ink2)}
.sv-d div span:last-child{font-weight:600;text-align:right}
.sv-regle{width:100%;justify-content:center;padding:13px;font-size:15.5px;margin-bottom:6px}
.sv-dt{display:flex;gap:8px;align-items:center}
.sv-dt input{flex:1}
.sv-hist{font-size:12.5px;color:var(--ink2);margin-top:6px}
.sv-hist div{padding:5px 0;border-bottom:1px solid var(--line)}
/* Comptabilité */
.cp-pr{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.cp-pr::-webkit-scrollbar{display:none}
.cp-pr button{flex:none;border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.cp-pr button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.cp-mo{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cp-mo button{border:1px solid var(--line2);background:var(--card);width:40px;height:40px;border-radius:11px;font-size:18px;color:var(--ink2);cursor:pointer;flex:none}
.cp-mo b{flex:1;text-align:center;font-size:16.5px}
.cp-k{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.cp-k div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);min-width:0}
.cp-k small{display:block;font-size:12.5px;font-weight:600;color:var(--ink2)}
.cp-k b{display:block;font-size:22px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-k .ca{background:var(--deep);border-color:var(--deep);color:#fff}
.cp-k .ca small{color:rgba(255,255,255,.72)} .cp-k .ca b{font-size:27px}
@media (max-width:760px){.cp-k{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cp-k .ca{grid-column:1/-1}.cp-k div{padding:11px 11px}.cp-k small{font-size:11.5px}.cp-k b{font-size:16.5px}.cp-k .ca b{font-size:28px}}
.cp-et{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:14px;background:var(--ambbg);color:var(--amb)}
.cp-et.ok{background:var(--grnbg);color:var(--grn)}
.cp-l{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.cp-j{border-bottom:1px solid var(--line)}
.cp-j:last-child{border-bottom:0}
.cp-j>button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.cp-j .d{flex:1;font-weight:600}
.cp-j .t{font-weight:600;font-variant-numeric:tabular-nums}
.cp-j .chev{width:16px;height:16px;color:var(--ink3);transition:transform .15s}
.cp-j.open .chev{transform:rotate(90deg)}
.cp-j .bar{height:4px;border-radius:2px;background:var(--accbg);margin:0 14px 10px;overflow:hidden}
.cp-j .bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.cp-md{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.cp-md span{background:#eef3f3;color:var(--ink2);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.cp-zero{color:var(--ink3);font-weight:400}
table.cp-t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cp-t th{text-align:right;font-size:12.5px;color:var(--ink2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#f4f7f7}
.cp-t th:first-child,.cp-t td:first-child{text-align:left}
.cp-t td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
.cp-t tr:last-child td{border-bottom:0}
.cp-t .neg{color:var(--red);font-weight:600} .cp-t .pos{color:var(--grn);font-weight:600}
.cp-i{padding:12px 14px;border-bottom:1px solid var(--line)}
.cp-i:last-child{border-bottom:0}
.cp-i .h{display:flex;gap:8px;align-items:baseline}
.cp-i .h b{flex:1}
.cp-i .h span{font-weight:600;font-variant-numeric:tabular-nums}
.cp-i .m{color:var(--ink2);font-size:13px;margin-top:2px}
.cp-vide{padding:16px 14px;color:var(--ink3);font-size:14px}
.cp-o{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.cp-s{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cp-s .n{font-size:13px;color:var(--ink3);font-weight:500}

.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:none;background:var(--card)}
.stp button{width:38px;height:38px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--acc)}
.stp button:disabled{color:var(--line2);cursor:default}
.stp span{min-width:28px;text-align:center;font-weight:600;font-size:15px}
.stp.on{border-color:var(--acc)}
.mg{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:16px 0 6px}
.ml{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:12px}
.ml-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);border-radius:var(--r) var(--r) 0 0}
.ml-h b{flex:1}
.ml-r{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.ml-r:last-child{border-bottom:0}
.ml-r .q{font-weight:600;min-width:38px;text-align:right}
.ml-r .w{color:var(--ink3);font-size:12.5px}
.ml-a{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.mbar{position:sticky;bottom:calc(var(--nav) + 8px);margin-top:12px;z-index:5}
@media (min-width:821px){.mbar{bottom:12px}}
.mbar .btn{width:100%;justify-content:center;padding:12px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* Divers */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.2);pointer-events:none}
.toast.e{background:var(--red)}
@media (max-width:760px){.toast{bottom:calc(var(--nav) + 18px)}}
.load{padding:60px 20px;text-align:center;color:var(--ink2)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:50% 100%;animation:b 1s linear infinite}
@keyframes b{from{background-position:-50% 0}to{background-position:150% 0}}
.refuse{max-width:440px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
/* Connexion */
.auth{max-width:400px;margin:48px auto 24px;padding:0 4px}
.auth .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.auth .brand i{width:42px;height:42px;border-radius:11px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:22px}
.auth .brand b{font-size:19px;letter-spacing:-.01em;display:block}
.auth .brand small{color:var(--ink2);font-size:13px}
.auth .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.auth h1{font-size:19px;margin:0 0 4px}
.auth p.sub{margin:0 0 18px;color:var(--ink2);font-size:14px}
.auth .fld input{font-size:16px}
.auth .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin:4px 0 16px;cursor:pointer}
.auth .chk input{width:18px;height:18px;accent-color:var(--acc)}
.auth .btn.pri{width:100%;justify-content:center;padding:11px 14px;font-size:15px}
.auth .links{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.auth .lk{font-size:14px}
.auth .ok-msg{background:var(--grnbg);color:var(--grn);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.auth input.code{letter-spacing:.4em;font-size:22px!important;text-align:center;font-variant-numeric:tabular-nums}
.out{border:0;background:none;color:var(--ink3);font-size:12.5px;cursor:pointer;padding:2px 0;text-decoration:underline}
.me-m{cursor:pointer}

/* ═══════════ Habillage : bleu nuit — système de design centralisé ═══════════
   Polices : Geist (titres) · Inter (tout le reste). Le blanc et le gris très clair dominent ;
   le bleu nuit signale l'action et la sélection ; le vert, l'orange et le rouge gardent leur sens. */
:root{
  /* couleurs */
  --bg:#EDF1F6; --card:#FFFFFF; --soft:#F6F8FB; --soft2:#EEF2F7;
  --line:#E2E8F0; --line2:#CBD5E1;
  --ink:#1C293A; --ink2:#66758B; --ink3:#617086;
  --acc:#29466B; --acc2:#365D82; --accbg:#E7EEF7; --accline:#CFDCEC;
  --deep:#29466B; --deep2:#365D82;
  --red:#B42318; --redbg:#FEF1F0; --redline:#F6C9C3;
  --amb:#A15C07; --ambbg:#FEF3E2; --ambline:#F7D9AE;
  --grn:#1E7A46; --grnbg:#EAF6EF; --grnline:#BFE3CC;
  --blu:#365D82; --blubg:#E7EEF7;
  --st-todo:#94A3B8; --st-cours:#E8913A; --st-fin:#3F9F6B;
  /* formes */
  --r:12px; --r-s:8px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.04);
  --sh-h:0 4px 14px rgba(15,23,42,.08);
  --focus:0 0 0 3px rgba(41,70,107,.18);
  /* typographie */
  --f-titre:"Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-texte:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
html,body{font-family:var(--f-texte);font-size:15px;line-height:1.5;font-feature-settings:"cv11","ss01"}
html{background:var(--deep)}
body{overflow-x:clip;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh}
h1,h2,h3,.dtitle,.ph h1,.dr-h b,.logo,.auth h1,.auth .brand b,.sv-g h2,.mc-h b,.cp-mo b,.modal .box h2,.modal .box h3{font-family:var(--f-titre);font-weight:600;letter-spacing:-.018em;color:var(--ink)}
h1{font-size:24px}
h2{font-size:18px;margin:28px 0 12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* chiffres alignés partout où il y a des montants, des heures ou des compteurs */
.stat b,.cnt,.sv-sum b,.sv-c .m,.cp-k b,.cp-j .t,.cp-t,.cp-i .h span,.ml-r .q,.stp span,.mi-h,.af-h,.pl,.sv-d,.cp-mo b{font-variant-numeric:tabular-nums}

/* ───── En-tête : bandeau bleu nuit, d'un seul tenant avec le titre de la page ───── */
header{background:var(--deep);border-bottom:0;color:#fff}
.hd{padding:12px 24px;gap:14px}
.logo{color:#fff;font-size:16.5px;white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--deep)}
.logo i svg{width:21px;height:21px}
.tabs{gap:2px;margin-left:10px}
.tab{color:rgba(255,255,255,.72);font-weight:500;font-size:14.5px;padding:8px 12px;border-radius:9px;white-space:nowrap;transition:background .12s,color .12s}
.tab:hover{background:rgba(255,255,255,.09);color:#fff}
.tab.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
@media (max-width:1180px){.tabs{margin-left:4px;gap:0}.tab{padding:8px 9px}}
.cnt{background:#E5484D;color:#fff;font-weight:600;box-shadow:0 0 0 2px var(--deep)}
.who{white-space:nowrap;color:rgba(255,255,255,.7);margin-left:0} .who b{color:#fff;font-weight:600}
.out{color:rgba(255,255,255,.75)}
.bell{color:rgba(255,255,255,.9);border-radius:10px} .bell:hover{background:rgba(255,255,255,.1)}
.me-m{color:rgba(255,255,255,.9);font-weight:600;cursor:pointer}
.av-m{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13.5px;letter-spacing:.02em;border:1.5px solid rgba(255,255,255,.35)}
@media (min-width:761px) and (max-width:1480px){.hd:has(#tabRel:not(.hidden)) .who{display:none}.hd:has(#tabRel:not(.hidden)) .me-m{display:block}.hd:has(#tabRel:not(.hidden)) .tab{padding:8px 10px}}
.nvadr{border-radius:10px;margin-top:12px;border:1px solid var(--ambline)}

/* ───── Titre de page : dans le bandeau bleu nuit ───── */
main{padding-top:0}
.ph{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;color:#fff;
  padding:14px 0 30px;margin-bottom:22px;background:var(--deep);box-shadow:0 0 0 100vmax var(--deep);clip-path:inset(0 -100vmax)}
.ph-t{flex:1 1 320px;min-width:0}
.ph h1{margin:0;font-size:28px;line-height:1.15;color:#fff}
.ph-g{margin:8px 0 0;color:rgba(255,255,255,.76);font-size:14.5px;line-height:1.5;max-width:66ch}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.ph .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:none}
.ph .btn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
.ph .btn.pri{background:#fff;border-color:#fff;color:var(--deep);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.ph .btn.pri:hover{background:#EEF3FA}
@media (max-width:760px){
  .hd{padding:10px 16px}
  .ph{padding:6px 0 22px;margin-bottom:16px}
  .ph h1{font-size:24px}
  .ph-g{font-size:14px}
  .ph-a{width:100%} .ph-a .btn{flex:1;justify-content:center;padding:11px 14px}
  .logo span{font-size:16px}
}

/* ───── Navigation du bas (téléphone) ───── */
@media (max-width:760px){
  .bnav{background:rgba(255,255,255,.96);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line)}
  .bnav button{color:var(--ink3);font-weight:500;font-size:11.5px;padding:7px 0 9px}
  .bnav button svg{width:52px;height:30px;padding:4px 15px;border-radius:15px;margin-bottom:3px;transition:background .15s,color .15s}
  .bnav button.on{color:var(--acc);font-weight:600}
  .bnav button.on svg{background:var(--accbg)}
  .bnav .cnt{top:3px;margin-left:8px;box-shadow:0 0 0 2px #fff}
}

/* ───── Boutons ───── */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r-s);padding:8px 14px;font-weight:500;font-size:14.5px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:background .12s,border-color .12s,box-shadow .12s,color .12s}
.btn:hover{background:var(--soft);border-color:var(--line2)}
.btn:active{background:var(--soft2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 1px 2px rgba(28,41,58,.18)}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.ok{background:var(--grnbg);border-color:var(--grnline);color:var(--grn)}
.btn.ok:hover{background:#DFF1E6}
.btn.ko{background:var(--card);border-color:var(--redline);color:var(--red)}
.btn.ko:hover{background:var(--redbg)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.lk{color:var(--acc);font-weight:500}
.lk:hover{text-decoration:underline}
a{color:var(--acc)}
.sbtn{border-radius:var(--r-s);font-weight:600;border-width:1px}
.sbtn.c{border-color:var(--ambline);color:var(--amb)} .sbtn.c:hover{background:var(--ambbg)}
.sbtn.c.on{background:var(--st-cours);border-color:var(--st-cours);color:#fff}
.sbtn.f{border-color:var(--grnline);color:var(--grn)} .sbtn.f:hover{background:var(--grnbg)}
.sbtn.f.on{background:var(--grn);border-color:var(--grn);color:#fff}

/* ───── Surfaces ───── */
.tc,.cg-c,.pc,.mc,.stat,.salle,.day,.ml,.grid,.refuse,.sv-c,.cp-k div,.cp-l{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);background:var(--card)}
.tc{padding:14px 16px;gap:14px;transition:border-color .12s,box-shadow .12s}
.tc .tt{font-size:15px;font-weight:600;letter-spacing:-.005em}
.tc.st-todo,.tc.st-cours,.tc.st-fin,.tc.late{border-left:1px solid var(--line);padding-left:19px;position:relative;overflow:hidden}
.tc.st-todo::before,.tc.st-cours::before,.tc.st-fin::before,.tc.late::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st-todo)}
.tc.st-cours::before{background:var(--st-cours)} .tc.st-fin::before{background:var(--st-fin)} .tc.late::before{background:var(--red)}
.tc:hover,.pc:hover,.stat:hover,.sv-c:hover,.cg-c:hover{border-color:var(--line2);box-shadow:var(--sh-h)}
.meta{color:var(--ink2);font-size:13px}
.dot{background:var(--acc)}
.pill{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--soft2);color:var(--ink2)}
.p-todo{background:#F1F5F9;color:#475569}
.p-cours{background:var(--ambbg);color:var(--amb)}
.p-att{background:var(--ambbg);color:var(--amb)}
.p-fin{background:var(--grnbg);color:var(--grn)}
.p-late,.p-urg,.p-haute{background:var(--redbg);color:var(--red);font-weight:600}
.stats{gap:12px}
.stat{padding:14px 16px;transition:border-color .12s,background .12s,box-shadow .12s}
.stat small{font-size:13px;font-weight:500;color:var(--ink2)}
.stat b{font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.stat.r b{color:var(--red)}
.stat.on{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 1px var(--acc)}
.stat.on b{color:var(--acc)}
.empty{background:transparent;border:1px dashed var(--line2);border-radius:var(--r);padding:32px 22px;color:var(--ink2);font-size:14.5px}

/* ───── Contrôles segmentés, filtres, puces ───── */
.seg{background:var(--soft2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border-radius:7px;padding:6px 12px;font-weight:500;font-size:14px;color:var(--ink2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--acc);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.08),0 0 0 1px rgba(15,23,42,.04)}
.seg-v{margin-bottom:16px}
.filters select,.filters input,.mq,.selp-q{border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);color:var(--ink)}
.filters select,.filters input{padding:8px 11px;min-height:40px;font-size:14.5px}
.mq{padding:12px 14px;border-radius:10px;box-shadow:var(--sh);font-size:15.5px}
.filters input:focus,.filters select:focus,.mq:focus,.selp-q:focus{outline:0;border-color:var(--acc);box-shadow:var(--focus)}
.chip,.pch,.cp-pr button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-weight:500}
.chip:hover,.pch:hover,.cp-pr button:hover{border-color:var(--line2);background:var(--soft)}
.chip.on,.pch.on,.cp-pr button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pch.moi{border-style:dashed;border-color:var(--acc);color:var(--acc)}
.pch.moi.on{border-style:solid;color:#fff}
.cp-pr button{color:var(--ink2);font-size:14px;padding:6px 14px}

/* ───── Formulaires ───── */
.fld label{font-size:13.5px;font-weight:500;color:var(--ink)}
.fld input[type=text],.fld input[type=email],.fld input[type=password],.fld input[type=date],.fld input[type=time],.fld input[type=url],.fld select,.fld textarea{border:1px solid var(--line2);border-radius:var(--r-s);padding:10px 12px;background:var(--card);color:var(--ink);font-size:15px;transition:border-color .12s,box-shadow .12s}
.fld input::placeholder,.fld textarea::placeholder,.filters input::placeholder,.mq::placeholder{color:#94A3B8}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--acc);box-shadow:var(--focus)}
.hint{color:var(--ink3);font-size:13px}
.err{color:var(--red)}
.selp-i input,.perm input,.auth .chk input{accent-color:var(--acc)}

/* Libellés de section */
.sec,.pg h2,h2.etage,.mg{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink2)}
.pg h2,h2.etage{font-family:var(--f-titre);font-size:15px;color:var(--ink)}
.sec{margin:24px 0 10px}
.selp-gt{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--ink2)}
.auj-t,.ajd-t{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--acc)}
.ma-t .ch{text-transform:none;letter-spacing:0;font-size:12px;color:var(--acc)}

/* ───── Panneau latéral, fenêtres, notifications ───── */
.ov{background:rgba(15,23,42,.36);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.dr{box-shadow:-16px 0 48px rgba(15,23,42,.14);padding-top:env(safe-area-inset-top)}
/* anciennes installations sur iPhone (barre d'état transparente) : la zone de l'heure reste bleu nuit pour rester lisible */
.dr{background:linear-gradient(var(--acc) env(safe-area-inset-top,0px),var(--card) env(safe-area-inset-top,0px))}
@media (min-width:761px){.dr{border-radius:16px 0 0 16px}}
.dr-h{padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-h b{font-size:18px}
.dr-b{padding:20px}
.dr-f{padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--soft);border-top:1px solid var(--line)}
.x{border-radius:8px;background:var(--soft2);color:var(--ink2)} .x:hover{background:var(--line);color:var(--ink)}
.dtitle{font-size:22px}
.acts,.ma,.desc,.cfg{background:var(--soft);border:1px solid var(--line);border-radius:10px}
.kv dt{color:var(--ink2)}
.alerte-n{top:calc(12px + env(safe-area-inset-top));border-radius:12px;border-color:var(--line);border-left-color:var(--acc);box-shadow:0 12px 32px rgba(15,23,42,.16)}
.alerte-n.h{border-left-color:var(--red)}
.modal{background:rgba(15,23,42,.45);padding-top:calc(16px + env(safe-area-inset-top))}
.modal .box{border-radius:14px;padding:22px;box-shadow:0 24px 64px rgba(15,23,42,.24)}
.toast{background:var(--ink);border-radius:10px;font-weight:500;box-shadow:0 8px 28px rgba(15,23,42,.22)}
.toast.e{background:var(--red)}
.nt:hover{background:var(--soft)}
.nt .dot{background:var(--acc)}
.spin{border-color:var(--line);border-top-color:var(--acc)}
.busy{background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:50% 100%}
.alerte{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.code-n input{background:#fff;border-color:var(--line2)}

/* Tâches : nouvelle tâche et urgences */
.tc.neuve{animation:neuve 2.4s ease-out}
@keyframes neuve{0%,35%{box-shadow:0 0 0 3px rgba(41,70,107,.28),var(--sh);background:var(--accbg)}100%{box-shadow:var(--sh)}}
.tc.urg{background:#FFF6F5;border-color:var(--redline)}
.tc.urg::before{background:var(--red)!important;width:5px}
.tc.urg .tt{color:#912018}
.tc.urg .p-haute{background:var(--red);color:#fff}
.tc.urg:hover{border-color:#EBA59B}
.urg-b{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.01em;padding:3px 9px 3px 7px;border-radius:999px;margin-bottom:7px}
.urg-b svg{width:13px;height:13px}
.urg-d{display:flex;gap:12px;align-items:center;background:var(--red);color:#fff;border-radius:10px;padding:12px 14px;margin:0 0 14px}
.urg-d svg{width:22px;height:22px;flex:none}
.urg-d b{display:block;font-size:15px;font-weight:600}
.urg-d span{font-size:13.5px;line-height:1.4}

/* ───── Tableaux et planning ───── */
.grid{overflow:auto}
table.pl{font-size:14px}
.pl th{background:var(--soft);color:var(--ink2);font-weight:600;font-size:12.5px;letter-spacing:.01em;padding:10px;border-color:var(--line)}
.pl td{border-color:var(--line)}
.pl th.td{background:var(--accbg);color:var(--acc)}
.pl td.nm{background:var(--soft);font-weight:600;color:var(--ink)}
.pl tr.me td.nm{color:var(--acc)}
.ed .cell:hover{background:#F5F8FC}
.cell .h{font-weight:600}
.cell.rep{color:var(--ink3);background:repeating-linear-gradient(-45deg,#F8FAFC,#F8FAFC 6px,#F1F4F8 6px,#F1F4F8 12px)}
.cell.cg,.day.cg{background:var(--ambbg);color:var(--amb)}
.day.td{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.day.rep{background:var(--soft);color:var(--ink3)}
.ajd,.auj{background:var(--accbg);border:1px solid var(--accline);border-radius:var(--r)}
.ajd-v{color:var(--acc)}
.auj-l .big{font-weight:600}
.af{border:1px solid var(--line);border-radius:var(--r-s);background:var(--soft)}
.af-c{border-color:var(--redline);background:var(--redbg)}
.af-d{font-weight:600}
.tag{background:var(--soft2);color:#475569;font-weight:500;border-radius:6px}
.av{background:var(--accbg);color:var(--acc);font-weight:600}
.pc.arch{background:var(--soft)}
.selp{border-color:var(--line)}
.selp-h{background:var(--soft);border-color:var(--line)}
.selp-i:hover{background:var(--soft)}
table.cp-t{font-size:14px}
.cp-t th{background:var(--soft);color:var(--ink2);font-size:12.5px;font-weight:600;letter-spacing:.01em;padding:10px 14px;border-bottom:1px solid var(--line)}
.cp-t td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink)}
.cp-t tbody tr:hover td{background:var(--soft)}
.cp-t .neg{color:var(--red);font-weight:600} .cp-t .pos{color:var(--grn);font-weight:600}

/* ───── Matériel ───── */
.mc{overflow:hidden}
.mc-h{padding:15px 16px}
.mc-h b{font-size:15.5px}
.ms-h{background:var(--soft);font-weight:600}
.ma-r.moi,.ma-r.sel{background:var(--accbg)}
.ma-r .cb{border:1.5px solid var(--line2);border-radius:7px}
.ma-r.sel .cb{background:var(--acc);border-color:var(--acc)}
.ma-k{color:var(--acc2)}
.ml-h{background:var(--soft)}
.ml-r .q{font-weight:600}
.stp{border-color:var(--line2)} .stp button{color:var(--acc)} .stp.on{border-color:var(--acc)} .stp span{font-weight:600}
.mbar .btn,.mbar2 .btn{box-shadow:0 6px 18px rgba(15,23,42,.14)}

/* ───── Comptabilité, impayés, relances ───── */
.cp-mo button{border:1px solid var(--line);color:var(--ink2);border-radius:var(--r-s)}
.cp-mo button:hover{background:var(--soft);color:var(--ink)}
.cp-mo b{font-size:17px}
.cp-k small{font-size:12.5px;font-weight:500;color:var(--ink2)}
.cp-k b{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.cp-k .ca{background:var(--acc);border-color:var(--acc);color:#fff}
.cp-k .ca small{color:rgba(255,255,255,.78)} .cp-k .ca b{color:#fff;font-size:28px}
@media (max-width:760px){.cp-k b{font-size:17px}.cp-k .ca b{font-size:26px}}
.cp-et{background:var(--ambbg);color:var(--amb);border:1px solid var(--ambline);border-radius:10px}
.cp-et.ok{background:var(--grnbg);color:var(--grn);border-color:var(--grnline)}
.cp-j .d{font-weight:500}
.cp-j .t{font-weight:600}
.cp-j .bar{background:var(--soft2)}
.cp-j .bar i{background:var(--acc2)}
.cp-md span{background:var(--soft2);color:var(--ink2);font-weight:500}
.cp-i .h span{font-weight:600}
.sv-sum{color:var(--ink2);font-size:14px}
.sv-sum b{font-size:22px;font-weight:600;color:var(--ink)}
.sv-sum b.r{color:var(--red)}
.sv-g h2{font-size:16px}
.sv-c{padding:13px 16px}
.sv-c .b b{font-size:15px;font-weight:600}
.sv-c .m{font-weight:600;font-size:15.5px}
.sv-c.imp{border-left:4px solid var(--red)}
.sv-rl span{background:var(--soft2);color:var(--ink2);font-weight:500}
.sv-rl span.f{background:var(--accbg);color:var(--acc)}
.sv-rl span.a{background:var(--ambbg);color:var(--amb)}
.sv-man{color:var(--amb);background:var(--ambbg);font-weight:500}
.sv-d{background:var(--soft);border:1px solid var(--line);border-radius:10px}
.sv-d div span:last-child{font-weight:600}

/* ───── Connexion : sur le bleu nuit ───── */
html.mode-auth,html.mode-auth body{background:var(--deep)}
.auth{margin-top:9vh}
.auth .brand{color:#fff;margin-bottom:26px}
.auth .brand i{background:#fff;color:var(--deep);width:46px;height:46px;border-radius:13px}
.auth .brand i svg{width:28px;height:28px}
.auth .brand b{font-size:21px;color:#fff}
.auth .brand small{color:rgba(255,255,255,.72);font-size:14px}
.auth .box{border:0;border-radius:18px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.auth h1{font-size:22px}
.auth p.sub{color:var(--ink2)}
.auth .btn.pri{padding:13px 14px;font-size:15.5px;border-radius:11px}
.auth .ok-msg{background:var(--grnbg);color:var(--grn)}

/* ───── Chiffre d'affaires ───── */
.cp-who{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.cp-who b{font-family:var(--f-titre);font-size:17px;font-weight:600}
.cp-who span{color:var(--ink2);font-size:14.5px;flex:1}
.cp-rf{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:var(--r-s);font-size:17px;color:var(--ink2);cursor:pointer}
.cp-k1{grid-template-columns:1fr}
.cp-sel{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.cp-sel label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.cp-sel select{border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);padding:8px 10px;min-height:40px;font-size:14.5px;color:var(--ink)}
.cp-sel button{border:1px solid var(--line);background:var(--card);width:40px;height:40px;border-radius:var(--r-s);font-size:17px;color:var(--ink2);cursor:pointer}
.cp-sel button:hover{background:var(--soft)}
.cp-h{margin-top:4px}
.cp-sc{overflow-x:auto}
.cp-t thead th{white-space:nowrap}
.cp-t td{white-space:nowrap}
.cp-t tr.clic{cursor:pointer}
.cp-t tr.clic:hover td{background:var(--accbg)}
.cp-t tr.sel td{background:var(--soft2);font-weight:600}
.cp-t tfoot td{background:var(--acc);color:#fff;font-weight:600;border-bottom:0;font-size:14.5px}
.cp-t tfoot td:first-child{letter-spacing:.02em}

/* ═══════════ Habillage royal : bleu nuit profond et bleu royal (maquette de référence) ═══════════
   Système commun : variables ci-dessous, réutilisées par toutes les rubriques. */
:root{
  --deep:#061B42; --deep2:#0A2A63; --navy-grad:linear-gradient(180deg,#061B42 0%,#071F4D 60%,#08245A 100%);
  --band-grad:linear-gradient(105deg,#061B42 0%,#0A2A6B 55%,#0B3DB0 100%);
  --acc:#0047D9; --acc-l:#125BFF; --acc2:#123B82; --accbg:#E8EFFE; --accline:#C7D7FB;
  --btn-grad:linear-gradient(180deg,#1D63FF 0%,#0047D9 100%);
  --bg:#F1F5FB; --card:#FFFFFF; --soft:#F6F9FD; --soft2:#EDF2FA;
  --line:#DCE5F2; --line2:#C3D1E6;
  --ink:#0B1736; --ink2:#526582; --ink3:#56688A;
  --red:#C81E1E; --redbg:#FDECEC; --redline:#F5C2C2;
  --amb:#B45309; --ambbg:#FFF1E0; --ambline:#F8D3A6;
  --grn:#15803D; --grnbg:#E6F6EC; --grnline:#B5E2C5;
  --blu:#0047D9; --blubg:#E8EFFE;
  --st-todo:#0047D9; --st-cours:#F08C1A; --st-fin:#16A34A;
  --r:14px; --r-s:10px;
  --sh:0 1px 2px rgba(11,23,54,.05),0 6px 18px rgba(11,23,54,.06);
  --sh-h:0 2px 4px rgba(11,23,54,.06),0 12px 28px rgba(11,23,54,.10);
  --focus:0 0 0 3px rgba(0,71,217,.22);
  --lat:248px; --lat-r:78px;
}
html{background:var(--deep)}
body{background:var(--bg);color:var(--ink)}
h1,.ph h1,.dtitle,.auth h1{font-weight:700;letter-spacing:-.02em}
h2,.dr-h b,.sv-g h2,.mc-h b,.cp-mo b,.cp-who b,.pg h2,h2.etage{font-weight:650}
:focus-visible{outline:2px solid var(--acc-l);outline-offset:2px}

/* ───── Boutons ───── */
.btn{border-radius:var(--r-s);font-weight:600;border-color:var(--line);transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}
.btn:hover{background:#F4F7FD;border-color:var(--line2)}
.btn.pri,.ph .btn.pri{background:var(--btn-grad);border:1px solid #0040C4;color:#fff;box-shadow:0 1px 2px rgba(0,40,140,.25),0 6px 16px rgba(0,71,217,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover,.ph .btn.pri:hover{background:linear-gradient(180deg,#2A6DFF 0%,#0A50E8 100%);transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,40,140,.25),0 10px 22px rgba(0,71,217,.32)}
.btn.pri:active{transform:none}
.ph .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.ph .btn:hover{background:rgba(255,255,255,.18)}
.lk,a{color:var(--acc)}
.btn.ok{background:var(--grnbg);border-color:var(--grnline);color:var(--grn)}
.btn.ko{border-color:var(--redline);color:var(--red)}

/* ───── Bandeau de page ───── */
.ph{background:var(--band-grad);box-shadow:0 0 0 100vmax var(--deep);clip-path:inset(0 -100vmax);color:#fff}
.ph h1{color:#fff;font-size:28px}
.ph-g{color:rgba(255,255,255,.78)}

/* ───── Cartes ───── */
.tc,.cg-c,.pc,.mc,.stat,.salle,.day,.ml,.grid,.refuse,.sv-c,.cp-k div,.cp-l,.rl-c,.ps-c,.mtab,.pg-c{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);background:var(--card)}
.tc,.cg-c,.sv-c,.rl-c,.ps-c,.stat,.mc{transition:box-shadow .18s,transform .18s,border-color .18s}
.tc:hover,.cg-c:hover,.sv-c:hover,.rl-c:hover,.stat:hover{box-shadow:var(--sh-h);transform:translateY(-1px);border-color:var(--line2)}
.cp-k .ca{background:var(--band-grad);border-color:transparent}
.empty{border-color:var(--line2);color:var(--ink2)}

/* ───── Statuts : bleu à faire, orange en cours, vert terminé, rouge urgent ───── */
.tc.st-todo::before{background:var(--st-todo)} .tc.st-cours::before{background:var(--st-cours)} .tc.st-fin::before{background:var(--st-fin)} .tc.late::before{background:var(--red)}
.p-todo{background:var(--accbg);color:var(--acc)}
.p-cours,.p-att{background:var(--ambbg);color:var(--amb)}
.p-fin{background:var(--grnbg);color:var(--grn)}
.p-late,.p-urg,.p-haute{background:var(--redbg);color:var(--red)}
.pill{font-weight:600}
.tc.urg{background:#FFF5F5;border-color:#F3B4B4;box-shadow:0 0 0 1px #F3B4B4,var(--sh)}
.tc.urg .tt{color:#9B1C1C}
.urg-b,.urg-d,.tc.urg .p-haute{background:#D92626}
.sbtn.c{border-color:var(--ambline);color:var(--amb)} .sbtn.c.on{background:var(--st-cours);border-color:var(--st-cours);color:#fff}
.sbtn.f{border-color:var(--grnline);color:var(--grn)} .sbtn.f.on{background:var(--st-fin);border-color:var(--st-fin);color:#fff}
.stat b{font-size:28px;font-weight:700;color:var(--ink)}
.stat small{font-weight:600;color:var(--ink2)}
.stats.st3 .stat:nth-child(2){background:#FFF6EB;border-color:#F8DDBB} .stats.st3 .stat:nth-child(2) small,.stats.st3 .stat:nth-child(2) b{color:#C2410C}
.stats.st3 .stat:nth-child(3){background:#ECF9F1;border-color:#C2E8D0} .stats.st3 .stat:nth-child(3) small,.stats.st3 .stat:nth-child(3) b{color:#15803D}
.stat.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.stat.on b{color:inherit}
.auj,.ajd{background:linear-gradient(180deg,#F2F6FF,#E8EFFE);border:1px solid var(--accline)}
.auj-t,.ajd-t,.ajd-v{color:var(--acc)}

/* ───── Contrôles ───── */
.seg{background:#E6ECF6;border:0;padding:4px;border-radius:12px}
.seg button{color:var(--ink2);font-weight:600;border-radius:9px}
.seg button.on{background:var(--btn-grad);color:#fff;box-shadow:0 2px 8px rgba(0,71,217,.28)}
.chip.on,.pch.on,.cp-pr button.on{background:var(--btn-grad);border-color:#0040C4;color:#fff;box-shadow:0 2px 8px rgba(0,71,217,.25)}
.chip,.pch,.cp-pr button{font-weight:600}
.filters select,.filters input,.mq,.fld input[type=text],.fld input[type=email],.fld input[type=password],.fld input[type=date],.fld input[type=time],.fld input[type=url],.fld select,.fld textarea,.cp-sel select{border:1px solid var(--line2);border-radius:var(--r-s);background:#fff;color:var(--ink)}
.filters input:focus,.filters select:focus,.mq:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:var(--focus);outline:0}
.hint{color:var(--ink3)}
.meta{color:var(--ink2)}

/* ───── Interrupteurs (autorisations et réglages) ───── */
.perm{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.perm:last-child{border-bottom:0}
.perm>span{order:1;flex:1;display:flex;gap:12px;align-items:flex-start;font-weight:600;color:var(--ink);font-size:14.5px}
.perm>span small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px;margin-top:1px}
.perm .pt{display:block}
.perm .pi{width:20px;height:20px;color:var(--acc);flex:none;margin-top:1px}
.perm input[type=checkbox]{order:2;-webkit-appearance:none;appearance:none;width:44px;height:26px;border-radius:999px;background:#CBD5E4;position:relative;flex:none;cursor:pointer;margin:0;transition:background .18s;border:0}
.perm input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(11,23,54,.3);transition:transform .18s}
.perm input[type=checkbox]:checked{background:var(--acc)}
.perm input[type=checkbox]:checked::after{transform:translateX(18px)}
.perm input[type=checkbox]:focus-visible{box-shadow:var(--focus);outline:0}
.perm input[type=checkbox]:disabled{cursor:not-allowed;opacity:.55}
.pg-c{padding:0 16px;margin:0 0 14px;overflow:hidden}
.pg-ch{display:flex;align-items:center;gap:10px;margin:0 -16px;padding:13px 16px;background:linear-gradient(180deg,#F4F7FE,#EDF2FC);border-bottom:1px solid var(--line)}

.mt-h{display:flex;align-items:center;margin:22px 0 10px}.mt-h h2{margin:0}

/* ═════════════ Animations (actives seulement avec html.anim ; coupées si « réduire les animations ») ═════════════ */
:root{
  --d-c:150ms; --d-n:220ms; --d-l:280ms; --d-x:620ms;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-io:cubic-bezier(.45,0,.25,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --t-op:opacity var(--d-n) var(--ease); --t-tr:transform var(--d-n) var(--ease);
  --sh-hover:0 2px 4px rgba(0,40,140,.25),0 12px 26px rgba(0,71,217,.36);
  --sq-base:#E4EBF6; --sq-reflet:#EEF3FB;
}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes a-fade{from{opacity:0}to{opacity:1}}
@keyframes a-monte{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes a-boite{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes a-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes a-pill{0%{transform:scale(.88);filter:brightness(1.25)}100%{transform:none;filter:none}}
@keyframes a-cloche{0%,100%{transform:rotate(0)}25%{transform:rotate(12deg)}55%{transform:rotate(-9deg)}80%{transform:rotate(4deg)}}
@keyframes a-reflet{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes a-barre{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes a-trait{to{stroke-dashoffset:0}}
@keyframes a-maj{0%{box-shadow:0 0 0 3px rgba(18,91,255,.45);background-color:#EAF1FF}100%{box-shadow:0 0 0 0 rgba(18,91,255,0)}}
@keyframes a-refus{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 1 · indicateur bleu royal qui glisse dans la barre latérale */
.tab-ind{display:none}
@media (min-width:761px){
  .tabs{position:relative}
  .tab{position:relative;z-index:1}
  .tab-ind{display:block;position:absolute;left:0;right:0;top:0;height:0;border-radius:11px;background:var(--btn-grad);box-shadow:0 6px 18px rgba(0,71,217,.45),inset 0 1px 0 rgba(255,255,255,.15);pointer-events:none;z-index:0;opacity:0}
  html.anim .tabs.ind-on .tab.on{background:transparent;box-shadow:none}
  html.anim .tabs.ind-on .tab-ind{opacity:1}
  html.anim .tabs.ind-pret .tab-ind{transition:transform 230ms var(--ease-io),height 230ms var(--ease-io),opacity var(--d-c)}
  html.anim .tab{transition:color 200ms var(--ease-io),background-color var(--d-c)}
}
/* 2 · barre latérale rétractable (ordinateur large) : largeur, libellés en fondu, icônes centrées */
@media (min-width:1100px){
  html.anim.anim-pret header{transition:width var(--d-l) var(--ease-io)}
  html.anim.anim-pret body{transition:padding-left var(--d-l) var(--ease-io)}
  html.anim header .hd{overflow:hidden}
  html.anim header .logo{white-space:nowrap}
  html.anim.anim-pret header .logo{transition:padding var(--d-l) var(--ease-io)}
  html.anim.anim-pret header .logo span,html.anim.anim-pret .tab .tl,html.anim.anim-pret .who-t,html.anim.anim-pret .who .out{transition:opacity 180ms var(--ease-io)}
  html.anim.anim-pret .who{transition:padding var(--d-l) var(--ease-io),background-color var(--d-l),border-color var(--d-l),gap var(--d-l)}
  html.anim.anim-pret .replier{transition:transform var(--d-l) var(--ease-io),background-color var(--d-c)}
  html.anim.lat-r header .logo{justify-content:flex-start;padding-left:7px;padding-right:0}
  html.anim.lat-r header .logo span{display:inline;opacity:0}

/* 5 et 6 · chiffres et barres */

.cp-j .bar{cursor:default}

.load.sq{padding:6px 0 20px;text-align:left;animation:a-fade 200ms 120ms ease backwards}

/* 8 · statut des tâches */
html.anim .sbtn{transition:background-color 260ms var(--ease-io),color 260ms var(--ease-io),border-color 260ms var(--ease-io),box-shadow 260ms var(--ease-io)}
.sbtn .ck{width:15px;height:15px;margin:-2px 5px -2px -2px;vertical-align:-2px;display:inline-block}
.sbtn .ck path{stroke-dasharray:24;stroke-dashoffset:24;animation:a-trait 320ms 40ms var(--ease-out) forwards}
html:not(.anim) .sbtn .ck path{stroke-dashoffset:0;animation:none}
html.anim .tc .pill.a-pill{animation:a-pill 320ms var(--ease-out)}
html.anim .a-refus{animation:a-refus 280ms var(--ease-io) 2}
/* 9 · notifications */
html.anim .cnt.a-pop{animation:a-pop 240ms var(--ease-out)}
html.anim .bell.a-cloche svg{transform-origin:50% 8%;animation:a-cloche 600ms var(--ease-io)}
/* 10 · planning : mise en évidence d'une affectation ou d'une case modifiée */
html.anim .a-maj{animation:a-maj 1.6s var(--ease) }
/* 12 · reflet discret sur les boutons principaux */
.btn.pri{position:relative;overflow:hidden;isolation:isolate}
.btn.pri::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.30) 50%,transparent 65%);transform:translateX(-130%)}
@media (hover:hover){
  html.anim .btn.pri:not(:disabled):hover::after{transform:translateX(130%);transition:transform 340ms var(--ease-io)}
  html.anim .btn.pri:not(:disabled):hover{filter:brightness(1.05);box-shadow:var(--sh-hover)}
}
@media (hover:none){html.anim .btn.pri:active{transform:scale(.97);filter:brightness(1.08);transition:transform 90ms,filter 90ms}}
/* 13 · fenêtres et formulaires */
html.anim #drawer.entre .ov{animation:a-fade 200ms var(--ease) backwards}
html.anim #drawer.entre .dr{animation:a-boite 210ms var(--ease-out) backwards}
html.anim .modal{animation:a-fade 200ms var(--ease) backwards}
html.anim .modal .box{animation:a-boite 210ms var(--ease-out) backwards}
.dr-sortie{position:fixed;inset:0;z-index:39;pointer-events:none}
.dr-sortie .ov{transition:opacity 150ms var(--ease-io)}
.dr-sortie .dr{transition:opacity 150ms var(--ease-io),transform 150ms var(--ease-io)}
.dr-sortie.fin .ov{opacity:0}
.dr-sortie.fin .dr{opacity:0;transform:translateY(8px) scale(.985)}
/* iPhone et tablettes : pas d'état « survol » collé après un toucher ; coche sans décaler le texte ; fenêtres en feuille qui monte du bas */
@media (hover:none){
  .sbtn.c:hover:not(.on),.sbtn.f:hover:not(.on){background:var(--card)}

  .tc .stb .sbtn .ck{position:absolute;left:12px;top:50%;margin:-7.5px 0 0}

@keyframes a-feuille{from{transform:translateY(100%)}to{transform:none}}

  .dr-sortie .dr{transition:transform 240ms cubic-bezier(.45,0,.25,1)}

/** Onglets ouverts à la personne (réglés par rôle dans « Personnel »). */
function ongletOuvert(v) {
  var o = (S.cfg && S.cfg.onglets) || { taches: true, planning: true, conges: true, materiel: true };
  if (v === 'personnel') return !!(S.cfg && S.cfg.gererPersonnel);
  if (v === 'compta') return !!(S.cfg && S.cfg.compta);
  if (v === 'impayes' || v === 'relances') return !!(S.cfg && (S.cfg.suivi || (S.cfg.suivi === undefined && S.cfg.compta)));
  return o[v] !== false;

function premierOnglet() { return ['taches', 'planning', 'conges', 'materiel', 'compta', 'impayes', 'protheses', 'personnel'].filter(ongletOuvert)[0] || 'taches'; }

  if (v === 'planning') ouvrirPlanning();

  if (v === 'personnel') chargerPersonnel();
  if (v === 'materiel') { rendreMateriel(); chargerMateriel(); }

  if (v === 'impayes' || v === 'relances') ouvrirSuivi(v);

function rendreListe() {

  var base = filtrerPortee(S.taches);
  var st = S.cfg.statuts.map(function (s) { return [s, s === 'Terminée' ? 'Terminées' : s, base.filter(function (t) { return t.statut === s; }).length]; });
  $('#stats').innerHTML = st.map(function (s) {

  var q = f.q.trim().toLowerCase();
  var l = base.filter(function (t) {
    if (f.statut === 'ouvertes' && t.statut === 'Terminée') return false;
    if (S.cfg.statuts.indexOf(f.statut) >= 0 && t.statut !== f.statut) return false;
    if (f.cat && t.categorie !== f.cat) return false;
    if (f.prio && t.priorite !== f.prio) return false;
    if (f.pers && !t.participations.some(function (x) { return x.id === f.pers; })) return false;
    if (f.cre && t.creePar !== f.cre) return false;

    return true;
  });
  l.sort(function (a, b) {
    if (a.statut === 'Terminée' && b.statut === 'Terminée') return a.termineeLe < b.termineeLe ? 1 : -1;
    if ((a.statut === 'Terminée') !== (b.statut === 'Terminée')) return a.statut === 'Terminée' ? 1 : -1;
    var pa = PRIO[a.priorite] == null ? 1 : PRIO[a.priorite], pb = PRIO[b.priorite] == null ? 1 : PRIO[b.priorite];
    if (pa !== pb) return pa - pb;

  if (!l.length) {
    $('#list').innerHTML = '<div class="empty">' + (S.taches.length ? 'Aucune tâche ne correspond à ces filtres.' : 'Aucune tâche pour l’instant. Créez la première avec « Nouvelle tâche ».') + '</div>';

  $('#list').innerHTML = l.map(carte).join('');

  brancherBoutonsStatut($('#list'));
}

function clsCarte(s) { return { 'À faire': 'st-todo', 'En cours': 'st-cours', 'Terminée': 'st-fin' }[s] || 'st-todo'; }
/** Les deux boutons d'action : En cours (orange) et Terminée (vert). Un second clic sur le bouton actif annule (retour à « À faire »). */
function boutonsStatut(t, pour, petit) {

function carte(t) {

// ───────── Sélecteur de personnes (même composant partout) ─────────
function groupesPersonnes(liste) {
  var ordre = S.cfg.fonctions || [];
  var res = ordre.map(function (f) { return { fonction: f === S.cfg.fonctionDentiste ? 'Chirurgiens-dentistes' : f === 'Secrétaire' ? 'Secrétaires' : f === 'Assistante dentaire' ? 'Assistantes dentaires' : f, cle: f, liste: [] }; });
  var autres = { fonction: 'Autres', cle: '', liste: [] };
  liste.forEach(function (u) { var g = res.filter(function (x) { return x.cle === u.fonction; })[0] || autres; g.liste.push(u); });
  if (autres.liste.length) res.push(autres);
  res.forEach(function (g) { g.liste.sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); }); });
  return res.filter(function (g) { return g.liste.length; });
}

/**
 * Sélection de membres du personnel par boutons (prénoms), regroupés par fonction, avec recherche rapide.
 * Le même composant sert partout (tâches, affectations). Les noms viennent de l'annuaire.
 * opts : { personnes, choisis (tableau d'identifiants, modifié en place), info(id) → texte, moi (bouton « Moi-même »), onChange }
 */
function selecteurPersonnes(zone, opts) {
  var sansAccent = function (x) { return String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
  var libelle = function (u) {
    var p = u.prenom || u.nom;
    var homonymes = opts.personnes.filter(function (v) { return (v.prenom || v.nom) === p; }).length > 1;
    return homonymes ? u.nom.replace(/^Dr\s+/, '') : p;
  };
  var dessiner = function () {
    var gs = groupesPersonnes(opts.personnes);
    var avecMoi = opts.moi && opts.personnes.some(function (u) { return u.id === S.me.id; });
    zone.innerHTML = '<div class="selp"><div class="selp-h"><input type="search" class="selp-q" placeholder="Rechercher un prénom" aria-label="Rechercher un prénom" autocomplete="off">' +
      '<span class="selp-n"></span></div>' +
      (avecMoi ? '<div class="selp-b" style="padding-top:10px"><button type="button" class="pch moi" data-moi="1">Moi-même</button></div>' : '') +
      '<div class="selp-l" style="max-height:none">' +
      gs.map(function (g) {
        return '<div class="selp-g" data-grp="' + esc(g.cle) + '"><div class="selp-gt"><span>' + esc(g.fonction) + '</span><button type="button" class="lk" data-g="' + esc(g.cle) + '">Tous</button></div>' +
          '<div class="selp-b"><div class="chips">' + g.liste.map(function (u) {
            var info = opts.info ? opts.info(u.id) : '';
            return '<button type="button" class="pch" data-id="' + esc(u.id) + '" data-q="' + esc(sansAccent((u.prenom || '') + ' ' + u.nom.replace(/^Dr\s+/, ''))) + '" title="' + esc(u.nom) + '">' + esc(libelle(u)) + (info ? ' <small>' + esc(info) + '</small>' : '') + '</button>';
          }).join('') + '</div></div></div>';
      }).join('') + '</div><div class="selp-s"></div></div>';
    var maj = function () {
      var n = opts.choisis.length;
      $('.selp-n', zone).textContent = n ? n + ' sélectionnée' + (n > 1 ? 's' : '') : 'Aucune sélection';
      $$('.pch[data-id]', zone).forEach(function (c) { var on = opts.choisis.indexOf(c.getAttribute('data-id')) >= 0; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
      var m = $('.pch[data-moi]', zone); if (m) { var on = opts.choisis.indexOf(S.me.id) >= 0; m.classList.toggle('on', on); m.setAttribute('aria-pressed', on); }
      $$('[data-g]', zone).forEach(function (b) {
        var vis = $$('.selp-g[data-grp="' + b.getAttribute('data-g') + '"] .pch:not(.hidden)', zone);
        b.textContent = vis.length && vis.every(function (c) { return c.classList.contains('on'); }) ? 'Retirer' : 'Tous';
      });
      var q = $('.selp-q', zone).value.trim();
      var cachees = opts.choisis.filter(function (id) { var c = $('.pch[data-id="' + id + '"]', zone); return c && c.classList.contains('hidden'); });
      $('.selp-s', zone).textContent = q && cachees.length ? 'Toujours sélectionnées : ' + cachees.map(function (id) { var u = opts.personnes.filter(function (x) { return x.id === id; })[0]; return u ? libelle(u) : id; }).join(', ') : '';
    };
    var basculer = function (id) { var i = opts.choisis.indexOf(id); if (i >= 0) opts.choisis.splice(i, 1); else opts.choisis.push(id); maj(); if (opts.onChange) opts.onChange(); };
    $$('.pch[data-id]', zone).forEach(function (c) { c.onclick = function () { basculer(c.getAttribute('data-id')); }; });
    if ($('.pch[data-moi]', zone)) $('.pch[data-moi]', zone).onclick = function () { basculer(S.me.id); };
    $('.selp-q', zone).oninput = function () {
      var q = sansAccent(this.value.trim());
      $$('.pch[data-id]', zone).forEach(function (c) { c.classList.toggle('hidden', !!q && c.getAttribute('data-q').indexOf(q) < 0); });
      $$('.selp-g', zone).forEach(function (g) { g.classList.toggle('hidden', !$$('.pch:not(.hidden)', g).length); });
      maj();
    };
    $$('[data-g]', zone).forEach(function (b) {
      b.onclick = function () {
        var vis = $$('.selp-g[data-grp="' + b.getAttribute('data-g') + '"] .pch:not(.hidden)', zone).map(function (c) { return c.getAttribute('data-id'); });
        var tous = vis.every(function (id) { return opts.choisis.indexOf(id) >= 0; });
        vis.forEach(function (id) { var i = opts.choisis.indexOf(id); if (tous && i >= 0) opts.choisis.splice(i, 1); if (!tous && i < 0) opts.choisis.push(id); });
        maj(); if (opts.onChange) opts.onChange();
      };
    });
    maj();
  };
  dessiner();
  return { redessiner: dessiner };
}

function fermer() { $('#drawer').innerHTML = ''; document.body.style.overflow = ''; S.detail = null; S.matTiroir = null; S.matListeOuverte = false; S.brSt = {}; S.brId = null; S.brBase = null; }

// ───────── Tâche : détail ─────────
function ouvrirTache(id) {
  // affichage immédiat avec ce qu'on a déjà (liste + détail préchargé) ; la mise à jour arrive juste après, sans bloquer
  var local = (S.taches || []).filter(function (x) { return x.id === id; })[0];
  var det = S.det && S.det[id];
  if (S.brId !== id) { S.brId = id; S.brSt = {}; }
  S.detail = id;
  if (local) afficherTache(Object.assign({}, local, det ? { commentaires: det.commentaires, historique: det.historique, suivi: det.suivi || local.suivi } : { commentaires: null, historique: null }));
  else tiroir('Tâche ' + esc(id), sq('mini'));
  // ouvrir la tâche la marque comme lue (et ses notifications aussi)
  apiFond('marquerLu', id).then(function (t) {
    garderDetail(t);
    afficherSiOuvert(t);
    if (S.notifs) { S.notifs.liste.forEach(function (n) { if (n.tache === id) n.lue = true; }); S.notifs.nonLues = S.notifs.liste.filter(function (n) { return !n.lue; }).length; majCloche(); }
  }).catch(function (e) { if (S.detail === id && !local) fermer(); echec(e); });
