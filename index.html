/** Détail complet des tâches (commentaires, historique) gardé en mémoire, préchargé en un seul appel discret. */
S.det = {};
function garderDetail(t) { if (t && t.id && t.commentaires) S.det[t.id] = { commentaires: t.commentaires, historique: t.historique, suivi: t.suivi, sig: sigTache(t) }; }
function sigTache(t) { return [t.majLe, t.nbCommentaires, t.statut, (t.participations || []).map(function (p) { return p.statut; }).join(',')].join('|'); }
var tPrecharge = null, prechargeEnCours = false;
function prechargerDetails() {
  clearTimeout(tPrecharge);
  tPrecharge = setTimeout(function () {
    if (prechargeEnCours || !S.taches || !S.cfg || (S.cfg.onglets && S.cfg.onglets.taches === false)) return;
    var l = S.taches.filter(function (t) { var d = S.det[t.id]; return !d || d.sig !== sigTache(t); })
      .sort(function (a, b) { return (a.statut === 'Terminée') - (b.statut === 'Terminée'); }).slice(0, 60);
    if (!l.length) return;
    prechargeEnCours = true;

      prechargeEnCours = false; sauverCache();
      Object.keys(r || {}).forEach(function (id) { var x = r[id]; S.det[id] = { commentaires: x.commentaires, historique: x.historique, suivi: x.suivi, sig: sigs[id] }; });
    }).catch(function () { prechargeEnCours = false; });
  }, 400);
}
/** Une réponse arrive : on rafraîchit le panneau seulement s'il montre encore cette tâche (sinon on ne le rouvre pas). */
function afficherSiOuvert(t) {
  if (S.detail === t.id && $('#drawer').innerHTML) afficherTache(t); else majLocale(t);
}

function majLocale(t) {
  var i = S.taches.findIndex(function (x) { return x.id === t.id; });

/**
 * Détail d'une tâche : les statuts choisis (le mien, et ceux des autres pour un administrateur) et le commentaire sont
 * enregistrés ensemble avec « Valider » ; la fenêtre se ferme dès la confirmation et la liste se met à jour sans rechargement.
 */
function brancherBrouillon(t) {
  var base = function (pour) { var p = t.participations.filter(function (x) { return x.id === (pour || S.me.id); })[0]; return p ? p.statut : 'À faire'; };
  var cur = function (pour) { return S.brSt[pour] !== undefined ? S.brSt[pour] : base(pour); };
  S.brBase = base;
  $$('#drb .sbtn[data-st]').forEach(function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      var pour = b.getAttribute('data-pour') || '', voulu = b.getAttribute('data-st');
      var c = cur(pour) === voulu ? 'À faire' : voulu;
      if (c === base(pour)) delete S.brSt[pour]; else S.brSt[pour] = c;
      majBrouillon();
    };
  });
  $('#tFer').onclick = fermer;
  $('#tVal').onclick = function () { validerTache(t); };
  majBrouillon();
}
function majBrouillon() {
  if (!$('#drb') || !S.brBase) return;
  var base = S.brBase;
  $$('#drb .sbtn[data-st]').forEach(function (x) {
    var pour = x.getAttribute('data-pour') || '', c = S.brSt[pour] !== undefined ? S.brSt[pour] : base(pour), on = x.getAttribute('data-st') === c;
    x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); x.classList.toggle('br', S.brSt[pour] !== undefined);
  });
  var n = Object.keys(S.brSt).length + ($('#com') && $('#com').value.trim() ? 1 : 0);
  if ($('#tBr')) $('#tBr').textContent = n ? n + ' modification' + (n > 1 ? 's' : '') + ' à valider' : '';
}
function validerTache(t) {
  var id = t.id, com = $('#com') ? $('#com').value.trim() : '';
  var changes = Object.keys(S.brSt).map(function (pour) { return { pour: pour, cible: S.brSt[pour] }; });
  if (!changes.length && !com) { fermer(); return; }
  // état affiché tout de suite (le serveur confirme juste après) ; en cas d'échec, tout revient et la fenêtre se rouvre
  var avant = (S.taches || []).filter(function (x) { return x.id === id; })[0];
  var brouillon = { st: Object.assign({}, S.brSt), com: com };
  if (avant) {
    var opt = JSON.parse(JSON.stringify(avant));
    changes.forEach(function (c) {
      var qui = c.pour || S.me.id;
      (opt.participations || []).forEach(function (p) { if (p.id === qui) { p.statut = c.cible; p.majLe = ''; } });
      if (qui === S.me.id) opt.monStatut = c.cible;
    });
    var sts = (opt.participations || []).map(function (p) { return p.statut; });
    if (sts.length) opt.statut = sts.every(function (x) { return x === 'Terminée'; }) ? 'Terminée' : sts.some(function (x) { return x === 'En cours' || x === 'Terminée'; }) ? 'En cours' : 'À faire';
    opt.nbTerminees = sts.filter(function (x) { return x === 'Terminée'; }).length;
    if (com) opt.nbCommentaires = (opt.nbCommentaires || 0) + 1;
    majLocale(opt);
  }
  S.brSt = {}; if (S.detail === id) fermer();
  var fin = changes.filter(function (c) { return !c.pour && c.cible === 'Terminée'; }).length;
  toast(fin ? 'Tâche terminée ✓' : 'Tâche enregistrée ✓');
  changes.forEach(function (c) { if (!c.pour) ANIM.statutOk(id, c.cible); });
  apiFond('validerTache', id, changes, com).then(function (r) {
    garderDetail(r); majLocale(r);
  }).catch(function (e) {
    if (avant) majLocale(avant);
    S.brId = id; S.brSt = brouillon.st;
    ouvrirTache(id);
    setTimeout(function () {
      if (S.detail !== id) return;
      if ($('#com') && brouillon.com) $('#com').value = brouillon.com;
      if ($('#tErr')) $('#tErr').textContent = 'Non enregistré : ' + msgErr(e) + ' Vos changements sont conservés : réessayez.';
      majBrouillon();
    }, 60);
    toast('Tâche non enregistrée : ' + msgErr(e), true);
  });
}

// ───────── Fichiers ─────────
function preparerFichier(file) {
  return new Promise(function (ok, ko) {
    if (file.size > 15 * 1024 * 1024) { ko(new Error('« ' + file.name + ' » est trop lourd (15 Mo max).')); return; }
    var r = new FileReader();
    r.onerror = function () { ko(new Error('Lecture impossible : ' + file.name)); };
    r.onload = function () {
      var data = r.result;
      if (!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)) { ok({ nom: file.name, mimeType: file.type || 'application/octet-stream', base64: data.split(',')[1] }); return; }
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var out = c.toDataURL('image/jpeg', 0.82);
        ok({ nom: file.name.replace(/\.\w+$/, '') + '.jpg', mimeType: 'image/jpeg', base64: out.split(',')[1] });
      };
      img.onerror = function () { ok({ nom: file.name, mimeType: file.type, base64: data.split(',')[1] }); };
      img.src = data;
    };
    r.readAsDataURL(file);
  });
}

// ───────── Planning ─────────
function vuesPlanning() {
  var v = [['jour', 'Par salle']];
  v.push(['personne', 'Par personne']);
  v.push(['horaires', 'Horaires']);
  return v;
}
function ouvrirPlanning() {
  if (!S.plVue || S.plVue === 'moi') S.plVue = S.cfg.estDentiste || S.cfg.dansPlanning ? 'personne' : 'jour';
  if (!S.jour) S.jour = S.today;
  if (S.plVue === 'jour') chargerJour(S.jour);
  else if (S.plVue === 'personne') {
    // par défaut : son propre planning (praticien ou assistante) ; sinon le premier praticien
    if (!S.cibleP) {
      var moiDans = S.cfg.estDentiste || S.cfg.dansPlanning;
      var d0 = S.users.filter(function (u) { return u.fonction === S.cfg.fonctionDentiste; })[0];
      S.cibleP = moiDans ? S.me.id : (d0 ? d0.id : '');
    }
    var u0 = S.users.filter(function (u) { return u.id === S.cibleP; })[0];
    S.cible = { id: S.cibleP, assistante: !!u0 && S.cfg.fonctionsAssistantes.indexOf(u0.fonction) >= 0 };
    chargerMoi(S.semaine);
  }
  else chargerPlanning(S.semaine);
}
function enTetePlanning() {

function brancherEnTete() {

function hm(h) { return String(h || '').replace(':', 'h'); }
function dJour(s) { var d = dj(s); return ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'][d.getDay()] + ' ' + dCourt(s); }

// ── Vue par salle (une journée) ──
S.jourCache = {};
function chargerJour(date) {
  S.jour = date;
  var c = S.jourCache[date];
  if (c) { S.aff = c; rendreJour(); }
  else if (!S.aff || S.aff.debut !== date || S.aff.fin !== date) attentePlanning();
  (c ? apiFond : api)('getAffectations', date, date).then(function (r) {
    var avant = JSON.stringify(S.jourCache[date] || null);
    S.jourCache[date] = r;
    if (S.vue === 'planning' && S.plVue === 'jour' && S.jour === date && JSON.stringify(r) !== avant) { S.aff = r; rendreJour(); }
    // jours voisins préparés à l'avance : précédent / suivant s'affichent sans attendre
    [ajout(date, 1), ajout(date, -1)].forEach(function (j) { if (!S.jourCache[j]) apiFond('getAffectations', j, j).then(function (x) { S.jourCache[j] = x; }).catch(function () { }); });
  }).catch(echec);
}
/** Le planning a changé chez quelqu'un d'autre : on remet à jour la vue affichée, sans écran d'attente. */
function rafraichirPlanningDiscret() {
  if (S.plVue === 'personne' && S.cible) chargerMoi(S.semaine);
  else if (S.plVue === 'jour') { delete S.jourCache[S.jour]; apiFond('getAffectations', S.jour, S.jour).then(function (r) { S.jourCache[S.jour] = r; if (S.vue === 'planning' && S.plVue === 'jour') { S.aff = r; rendreJour(); } }).catch(function () { }); }
  else if (S.plVue === 'horaires') chargerPlanning(S.semaine);
}

  var h = enTetePlanning() +

    (ed ? '<button class="btn sm" id="dSalles">Salles</button><button class="btn sm" id="dCopy">Reprendre ' + esc(dJour(ajout(date, -7)).toLowerCase()) + '</button><button class="btn sm pri" id="dAdd">+ Affectation</button>' : '') + '</div>';
  if (r.conflits.length) {
    h += '<div class="alerte" role="status"><b>' + r.conflits.length + ' point' + (r.conflits.length > 1 ? 's' : '') + ' à vérifier</b>' +
      r.conflits.map(function (c) { return '<div>' + (c.type === 'absence' ? 'Attention : ' : 'Conflit : ') + esc(c.message) + '</div>'; }).join('') + '</div>';
  }
  var etages = [];
  r.salles.forEach(function (s) {
    var a = r.affectations.filter(function (x) { return x.salle === s.id; });
    if (!s.active && !a.length) return;
    var e = etages.filter(function (x) { return x.nom === s.etage; })[0];
    if (!e) { e = { nom: s.etage, salles: [] }; etages.push(e); }
    e.salles.push({ s: s, a: a });
  });
  var sansSalle = r.affectations.filter(function (x) { return !x.salle || !r.salles.some(function (s) { return s.id === x.salle; }); });
  // frise de la journée : occupation de chaque salle (purement visuelle)
  var mnT = function (t) { var m = String(t || '').match(/(\d{1,2})\D?(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
  var jr = (S.cfg.creneaux && S.cfg.creneaux.journee) || ['09:00', '19:00'];
  var t0 = mnT(jr[0]) || 540, t1 = mnT(jr[1]) || 1140;
  r.affectations.forEach(function (a) { var d = mnT(a.debut), f = mnT(a.fin); if (d !== null && d < t0) t0 = d; if (f !== null && f > t1) t1 = f; });
  var frise = function (liste) {
    return '<div class="sl-tl" aria-hidden="true"><div class="sl-tr">' + liste.map(function (a) {
      var d = mnT(a.debut), f = mnT(a.fin); if (d === null || f === null || f <= d) return '';
      return '<i class="' + (a.conflits.length ? 'c' : '') + '" style="left:' + ((d - t0) / (t1 - t0) * 100).toFixed(2) + '%;width:' + ((f - d) / (t1 - t0) * 100).toFixed(2) + '%"></i>';
    }).join('') + '</div><div class="sl-hs"><span>' + Math.floor(t0 / 60) + 'h</span><span>' + Math.floor((t0 + t1) / 120) + 'h</span><span>' + Math.ceil(t1 / 60) + 'h</span></div></div>';
  };
  var initDr = function (n) { return String(n || '').replace(/^Dr\.?\s+/i, '').split(/\s+/).filter(Boolean).slice(0, 2).map(function (x) { return x.charAt(0).toUpperCase(); }).join(''); };
  var carteSalle = function (titre, liste, id, inactive) {
    return '<section class="salle' + (liste.length ? ' occ' : '') + '"><div class="sh"><i class="sl-dot" aria-hidden="true"></i><b>' + esc(titre) + '</b>' + (inactive ? ' <span class="tag">désactivée</span>' : '') +
      '<span class="sl-n">' + (liste.length ? liste.length + ' créneau' + (liste.length > 1 ? 'x' : '') : 'Libre') + '</span>' +
      (ed && id !== null ? '<button class="lk" data-add="' + esc(id) + '" aria-label="Ajouter une affectation dans ' + esc(titre) + '">+ Ajouter</button>' : '') + '</div>' +
      (liste.length ? frise(liste) : '') +
      (liste.length ? liste.map(function (a) {
        return '<div class="af' + (a.conflits.length ? ' af-c' : '') + (ed ? ' ed' : '') + '" data-id="' + esc(a.id) + '"' + (ed ? ' role="button" tabindex="0"' : '') + '>' +
          '<span class="af-av" aria-hidden="true">' + esc(initDr(a.dentisteNom)) + '</span><div class="af-b">' +
          '<div class="af-h">' + hm(a.debut) + ' – ' + hm(a.fin) + '</div><div class="af-d">' + esc(a.dentisteNom) + '</div>' +
          '<div class="af-a">' + htmlAssistantes(a) + '</div>' + (a.note ? '<div class="af-n">' + esc(a.note) + '</div>' : '') + htmlProblemes(a) + '</div></div>';
      }).join('') : '<div class="libre">Libre</div>') + '</section>';
  };
  etages.forEach(function (e) {
    h += '<h2 class="etage">' + esc(e.nom || 'Sans étage') + '</h2><div class="salles">' + e.salles.map(function (x) { return carteSalle(x.s.nom, x.a, x.s.id, !x.s.active); }).join('') + '</div>';
  });
  if (sansSalle.length) h += '<h2 class="etage">Salle à définir</h2><div class="salles">' + carteSalle('Salle à définir', sansSalle, '', false) + '</div>';
  if (!r.salles.length) h += '<div class="empty">Aucune salle n’est enregistrée.</div>';
  if (ed) h += '<div class="hint" style="margin-top:10px">Touchez une affectation pour la modifier. Une même assistante peut être affectée à plusieurs praticiens en même temps : c’est indiqué « Assistante partagée », pas un conflit.</div>';
  $('#main').innerHTML = h;
  brancherEnTete();
  $('#dPrev').onclick = function () { chargerJour(ajout(date, -1)); };
  $('#dNext').onclick = function () { chargerJour(ajout(date, 1)); };
  $('#dNow').onclick = function () { chargerJour(S.today); };
  $('#dPick').onchange = function () { if (this.value) chargerJour(this.value); };
  if (ed) {
    $('#dAdd').onclick = function () { formAffectation(null, ''); };
    $('#dSalles').onclick = formSalles;
    $('#dCopy').onclick = function () {
      api('copierAffectationsJour', date).then(function (x) { S.aff = x; rendreJour(); toast(x.copies ? x.copies + ' affectation(s) reprise(s) de la semaine précédente' : 'Rien à reprendre (déjà saisi ou jour précédent vide)'); }).catch(echec);
    };
    $$('[data-add]').forEach(function (b) { b.onclick = function () { formAffectation(null, b.getAttribute('data-add')); }; });
    $$('.af.ed').forEach(function (c) {
      var ouvrir = function () { formAffectation(r.affectations.filter(function (a) { return a.id === c.getAttribute('data-id'); })[0]); };
      c.onclick = ouvrir;
      c.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrir(); } };
    });
  }
}

// ── Mon planning (praticien ou assistante) ──
S.semCache = {};
function chargerMoi(sem) {
  S.semaine = lundi(sem || S.today);
  var semaine = S.semaine, fin = ajout(semaine, 6), vue = S.plVue, c = S.semCache[semaine];
  // déjà en mémoire : affichage immédiat (changement de personne ou de semaine déjà vue), mise à jour discrète ensuite
  if (c && (c.pl || !S.cible.assistante)) { S.moiAff = c.aff; S.moiPl = c.pl; rendreMoi(); }
  else attentePlanning();
  var f = c ? apiFond : api;
  Promise.all([f('getAffectations', semaine, fin), f('getPlanning', semaine).catch(function () { return null; })])
    .then(function (x) {
      var avant = JSON.stringify(S.semCache[semaine] || null);
      S.semCache[semaine] = { aff: x[0], pl: x[1] }; sauverCache();
      if (S.vue !== 'planning' || S.plVue !== vue || S.semaine !== semaine) return;
      if (JSON.stringify(S.semCache[semaine]) === avant && c) return; // rien de nouveau : pas de redessin
      S.moiAff = x[0]; S.moiPl = x[1]; rendreMoi();
    }).catch(echec);
}

function rendreMoi() {
  var r = S.moiAff, p = S.moiPl, moi = S.cible.id, assistante = S.cible.assistante, perso = S.plVue === 'personne';
  var jours = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return ajout(S.semaine, i); }); // du lundi au dimanche
  var mes = r.affectations.filter(function (a) { return assistante ? a.assistantes.some(function (y) { return y.cle === moi; }) : a.dentiste === moi; });
  var ligne = function (a) {
    var moiA = a.assistantes.filter(function (y) { return y.cle === moi; })[0];
    if (assistante) {
      return '<div class="mi"><div class="mi-h">' + hm(a.debut) + ' – ' + hm(a.fin) + '</div><div><b>' + esc(a.dentisteNom) + '</b> · ' + esc(nomSalle(a)) +
        (moiA && moiA.partageeAvec.length ? '<div><span class="tag t-info">Assistante partagée</span> <span class="meta">aussi avec ' + esc(moiA.partageeAvec.map(function (q) { return q.dentisteNom + (q.salleNom ? ' (' + q.salleNom + ')' : ''); }).join(', ')) + '</span></div>' : '') +
        htmlProblemes(a) + '</div></div>';
    }
    return '<div class="mi"><div class="mi-h">' + hm(a.debut) + ' – ' + hm(a.fin) + '</div><div><b>' + esc(nomSalle(a)) + '</b><div class="af-a">' + htmlAssistantes(a) + '</div>' + htmlProblemes(a) + '</div></div>';
  };
  // Carte « Aujourd'hui » en tête
  var auj = mes.filter(function (a) { return a.date === S.today; });
  var h = enTetePlanning();
  if (perso) {
    var cand = S.users.filter(function (u) { return u.fonction === S.cfg.fonctionDentiste || S.cfg.fonctionsAssistantes.indexOf(u.fonction) >= 0; });
    h += '<div class="fld" style="max-width:420px"><label for="pCible">Praticien ou assistante</label><select id="pCible">' + groupesPersonnes(cand).map(function (g) {
      return '<optgroup label="' + esc(g.fonction) + '">' + g.liste.map(function (u) { return '<option value="' + esc(u.id) + '"' + (u.id === moi ? ' selected' : '') + '>' + esc(u.nom) + '</option>'; }).join('') + '</optgroup>';
    }).join('') + '</select></div>';
  }
  if (jours.indexOf(S.today) >= 0) {
    h += '<div class="auj"><div class="auj-t">Aujourd’hui · ' + esc(dJour(S.today)) + '</div>' +
      (auj.length ? auj.map(function (a) {
        return assistante
          ? '<div class="auj-l"><span class="big">' + esc(a.dentisteNom) + '</span><span>' + esc(nomSalle(a)) + ' · ' + hm(a.debut) + ' – ' + hm(a.fin) + '</span></div>'
          : '<div class="auj-l"><span class="big">' + esc(nomSalle(a)) + '</span><span>' + hm(a.debut) + ' – ' + hm(a.fin) + ' · avec ' + (a.assistantes.length ? esc(a.assistantes.map(function (y) { return y.nom; }).join(', ')) : 'assistante à affecter') + '</span></div>';
      }).join('') : '<div class="auj-l"><span>' + (perso ? 'Aucune affectation aujourd’hui.' : assistante ? 'Aucun praticien ne vous est affecté aujourd’hui.' : 'Aucune salle ne vous est affectée aujourd’hui.') + '</span></div>') + '</div>';
  }
  h += '<div class="wk"><button class="btn sm" id="mPrev" aria-label="Semaine précédente">‹</button><span class="nm">Semaine du ' + dCourt(jours[0]) + ' au ' + dCourt(jours[6]) + '</span>' +
    '<button class="btn sm" id="mNext" aria-label="Semaine suivante">›</button><button class="btn sm" id="mNow">Cette semaine</button></div><div class="days">';
  jours.forEach(function (j, i) {
    var lst = mes.filter(function (a) { return a.date === j; });
    var hor = '';
    if (assistante && p) {
      var cg = p.conges.filter(function (c) { return c.email === moi && c.debut <= j && c.fin >= j; })[0];
      var c = p.creneaux.filter(function (x) { return x.email === moi && x.jour === i; })[0];
      hor = cg ? '<div class="meta"><b>Congé</b></div>' : !c ? '' : c.statut === 'Repos' ? '<div class="meta"><b>Repos</b></div>' :
        '<div class="meta">Horaires : ' + hm(c.debut) + ' – ' + hm(c.fin) + (c.pauseDebut && c.pauseFin ? ' · pause ' + hm(c.pauseDebut) + ' – ' + hm(c.pauseFin) : '') + (c.heuresSup ? ' · <span style="color:var(--amb)">+' + esc(c.heuresSup) + ' sup</span>' : '') + (c.note ? ' · <i>' + esc(c.note) + '</i>' : '') + '</div>';
    }
    h += '<div class="day' + (j === S.today ? ' td' : '') + (lst.length ? ' occ' : '') + '"><div class="d"><span class="d-n" aria-hidden="true">' + Number(j.slice(8, 10)) + '</span><span class="d-t"><b>' + JOURS[i] + '</b><small>' + dCourt(j) + (j === S.today ? ' · aujourd’hui' : '') + '</small></span></div><div class="c">' + hor +
      (lst.length ? lst.map(ligne).join('') : '<div class="meta">' + (assistante ? 'Aucun praticien affecté' : 'Pas d’affectation') + '</div>') + '</div></div>';
  });
  h += '</div>';
  $('#main').innerHTML = h;
  brancherEnTete();
  if ($('#pCible')) $('#pCible').onchange = function () { S.cibleP = this.value; ouvrirPlanning(); };
  // les semaines voisines sont préparées en arrière-plan : la navigation est immédiate
  [-7, 7].forEach(function (k) {
    var w = ajout(S.semaine, k);
    if (S.semCache[w]) return;
    Promise.all([api('getAffectations', w, ajout(w, 6)), api('getPlanning', w).catch(function () { return null; })]).then(function (x) { S.semCache[w] = { aff: x[0], pl: x[1] }; }).catch(function () { });
  });
  $('#mPrev').onclick = function () { chargerMoi(ajout(S.semaine, -7)); };
  $('#mNext').onclick = function () { chargerMoi(ajout(S.semaine, 7)); };
  $('#mNow').onclick = function () { chargerMoi(S.today); };
}

// ── Éditeur d'affectation ──
function formAffectation(a, salleInit) {
  var r = S.aff, ed = !!a;
  a = a || { id: '', date: S.jour, dentiste: '', salle: salleInit || '', debut: S.cfg.creneaux.journee[0], fin: S.cfg.creneaux.journee[1], assistantes: [], note: '' };
  var choisisIds = a.assistantes.filter(function (y) { return !y.independante; }).map(function (y) { return y.cle; });
  var externes = a.assistantes.filter(function (y) { return y.independante; }).map(function (y) { return 'ext:' + y.nom; });
  var etages = [];
  r.salles.filter(function (s) { return s.active || s.id === a.salle; }).forEach(function (s) {
    var e = etages.filter(function (x) { return x.nom === s.etage; })[0];
    if (!e) { e = { nom: s.etage, s: [] }; etages.push(e); }
    e.s.push(s);
  });
  var optSalles = '<option value="">Salle à définir</option>' + etages.map(function (e) {
    return '<optgroup label="' + esc(e.nom || 'Sans étage') + '">' + e.s.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === a.salle ? ' selected' : '') + '>' + esc(s.nom) + '</option>'; }).join('') + '</optgroup>';
  }).join('');
  var optDent = '<option value="">Choisir…</option>' + r.dentistes.map(function (d) { return '<option value="' + esc(d.id) + '"' + (d.id === a.dentiste ? ' selected' : '') + '>' + esc(d.nom) + '</option>'; }).join('');
  var C = S.cfg.creneaux;
  var preset = a.debut === C.journee[0] && a.fin === C.journee[1] ? 'journee' : a.debut === C.matin[0] && a.fin === C.matin[1] ? 'matin' : a.debut === C.apresMidi[0] && a.fin === C.apresMidi[1] ? 'apresMidi' : 'autre';
  var corps =
    '<div class="two"><div class="fld"><label for="eD">Date</label><input type="date" id="eD" value="' + esc(a.date) + '"></div>' +
    '<div class="fld"><label for="eP">Praticien *</label><select id="eP">' + optDent + '</select></div></div>' +
    '<div class="fld"><label for="eS">Cabinet ou bloc</label><select id="eS">' + optSalles + '</select></div>' +
    '<div class="fld"><label>Créneau</label><div class="seg" id="eC">' +
    [['journee', 'Journée'], ['matin', 'Matin'], ['apresMidi', 'Après-midi'], ['autre', 'Autre']].map(function (x) { return '<button type="button" data-c="' + x[0] + '"' + (x[0] === preset ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('') +
    '</div><div class="two" style="margin-top:8px"><div><label for="eH1" class="sr">Début</label><input type="time" id="eH1" step="900" value="' + esc(a.debut) + '" aria-label="Début"></div><div><input type="time" id="eH2" step="900" value="' + esc(a.fin) + '" aria-label="Fin"></div></div>' +
    '<label class="chk2" id="eSplitL" style="margin-top:10px;font-size:14px;color:var(--ink)"><input type="checkbox" id="eSplit"> Assistante différente le matin et l’après-midi</label></div>' +
    '<div class="fld"><label id="eAL">Assistantes</label><div id="eA"></div><div class="chips" id="eX" style="margin-top:8px"></div>' +
    '<div class="indep"><input type="text" id="eI" maxlength="60" placeholder="Nom de l’indépendante (facultatif)" aria-label="Nom de l’assistante indépendante"><button type="button" class="btn sm" id="eIAdd">+ Assistante indépendante</button></div></div>' +
    '<div class="fld hidden" id="eB2"><label id="eAL2">Assistantes de l’après-midi</label><div id="eA2"></div><div class="chips" id="eX2" style="margin-top:8px"></div>' +
    '<div class="indep"><input type="text" id="eI2" maxlength="60" placeholder="Nom de l’indépendante (facultatif)" aria-label="Nom de l’assistante indépendante de l’après-midi"><button type="button" class="btn sm" id="eIAdd2">+ Assistante indépendante</button></div></div>' +
    '<div class="hint" style="margin:-6px 0 14px">Sans assistante, l’affectation apparaît « Assistante à affecter ». Une assistante déjà prévue ailleurs sur ce créneau reste sélectionnable (assistante partagée).</div>' +
    '<div class="fld"><label for="eN">Note</label><input type="text" id="eN" maxlength="200" placeholder="Chirurgie implantaire" value="' + esc(a.note || '') + '"></div>' +
    (ed && a.majParNom ? '<div class="hint">Modifié par ' + esc(a.majParNom) + (a.majLe ? ' le ' + esc(dHeure(a.majLe)) : '') + '</div>' : '') +
    '<div class="err" id="eErr"></div>';
  tiroir(ed ? 'Modifier l’affectation' : 'Nouvelle affectation', corps,
    (ed ? '<button class="btn ko" id="eDel">Supprimer</button><span class="sp"></span>' : '') + '<button class="btn" id="eAnn">Annuler</button><button class="btn pri" id="eOk">Enregistrer</button>');

  var dispoTexte = function (email) {
    var d = r.dispo[email + '|' + $('#eD').value];
    if (!d) return '';
    if (d.statut === 'Congé') return 'en congé';
    if (d.statut === 'Repos') return 'repos';
    return d.debut && d.fin ? hm(d.debut) + '–' + hm(d.fin) : '';
  };
  var choisis2 = [], externes2 = [];
  /** Sélecteur d'assistantes + indépendantes (utilisé une fois, ou deux fois pour matin / après-midi). */
  var bloc = function (suf, ids, ext) {
    var sel = null;
    var rendre = function () {
      if (!sel) sel = selecteurPersonnes($('#eA' + suf), { personnes: r.assistantes, choisis: ids, info: dispoTexte });
      else sel.redessiner();
      $('#eX' + suf).innerHTML = ext.map(function (k) {
        return '<span class="chip on ext">' + esc(k.slice(4)) + ' · indépendante <button type="button" class="x-ext" data-k="' + esc(k) + '" aria-label="Retirer ' + esc(k.slice(4)) + '">×</button></span>';
      }).join('');
      $$('#eX' + suf + ' .x-ext').forEach(function (b) { b.onclick = function () { ext.splice(ext.indexOf(b.getAttribute('data-k')), 1); rendre(); }; });
    };
    $('#eIAdd' + suf).onclick = function () {

      if (!n) {
        // numérotation des indépendantes non identifiées, pour distinguer plusieurs présentes le même jour
        var pris = {};
        r.affectations.forEach(function (x) { if (x.date === $('#eD').value) x.assistantes.forEach(function (y) { if (y.independante) pris[y.nom] = 1; }); });
        externes.concat(externes2).forEach(function (k) { pris[k.slice(4)] = 1; });
        var i = 1; while (pris['Indépendante n°' + i]) i++;
        n = 'Indépendante n°' + i;
      }
      if (ext.indexOf('ext:' + n) < 0) ext.push('ext:' + n);
      $('#eI' + suf).value = ''; rendre();
    };
    $('#eI' + suf).onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('#eIAdd' + suf).click(); } };

  };
  var rendreChips = bloc('', choisisIds, externes);
  var rendreChips2 = null;
  var majSplit = function () {

    $('#eSplitL').classList.toggle('hidden', !possible);
    if (!possible) $('#eSplit').checked = false;
    var on = $('#eSplit').checked;
    $('#eB2').classList.toggle('hidden', !on);
    $('#eAL').textContent = on ? 'Assistantes du matin (' + hm($('#eH1').value) + '–' + hm(C.matin[1]) + ')' : 'Assistantes';
    $('#eAL2').textContent = 'Assistantes de l’après-midi (' + hm(C.apresMidi[0]) + '–' + hm($('#eH2').value) + ')';
    if (on && !rendreChips2) {
      // l'après-midi démarre avec les mêmes assistantes que le matin : il suffit de changer celle qui diffère
      choisisIds.forEach(function (x) { choisis2.push(x); }); externes.forEach(function (x) { externes2.push(x); });
      rendreChips2 = bloc('2', choisis2, externes2);
    }
  };
  $('#eSplit').onchange = majSplit;
  majSplit();
  $('#eD').onchange = function () { rendreChips(); if (rendreChips2) rendreChips2(); };
  $$('#eC button').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-c');
      $$('#eC button').forEach(function (x) { x.classList.toggle('on', x === b); });
      if (C[k]) { $('#eH1').value = C[k][0]; $('#eH2').value = C[k][1]; } else $('#eH1').focus();
      majSplit();
    };
  });
  ['#eH1', '#eH2'].forEach(function (s) { $(s).oninput = function () { $$('#eC button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-c') === 'autre'); }); majSplit(); }; });
  $('#eAnn').onclick = fermer;
  if ($('#eDel')) $('#eDel').onclick = function () {
    if (!confirm('Supprimer cette affectation ? Les autres affectations ne changent pas.')) return;
    api('supprimerAffectation', a.id).then(function (x) { S.aff = x; fermer(); rendreJour(); toast('Affectation supprimée'); }).catch(echec);
  };
  $('#eOk').onclick = function () {
    var d = { id: a.id, date: $('#eD').value, dentiste: $('#eP').value, salle: $('#eS').value, debut: $('#eH1').value, fin: $('#eH2').value, assistantes: choisisIds.concat(externes), note: $('#eN').value.trim() };
    var err = function (m) { $('#eErr').textContent = m; };
    if (!d.date) return err('Indiquez la date.');
    if (!d.dentiste) return err('Choisissez le praticien.');
    if (!d.debut || !d.fin) return err('Indiquez l’heure de début et de fin.');
    if (d.fin <= d.debut) return err('L’heure de fin doit être après l’heure de début.');
    var b = this; b.disabled = true;
    var fin = function (x, n) {
      S.aff = x; S.jour = d.date; fermer(); rendreJour();
      var e = x.enregistre;
      if (e && (e.conflits.length || e.alertes.length)) toast('Enregistré, mais à vérifier : ' + (e.conflits[0] || e.alertes[0]), true);
      else toast(n > 1 ? 'Matin et après-midi enregistrés' : 'Affectation enregistrée');
    };
    if ($('#eSplit').checked) {
      // deux créneaux : le matin (même fiche si elle existait) puis l'après-midi (nouvelle fiche)
      var m = Object.assign({}, d, { fin: C.matin[1] });
      var am = Object.assign({}, d, { id: '', debut: C.apresMidi[0], assistantes: choisis2.concat(externes2) });
      api('enregistrerAffectation', m).then(function () { return api('enregistrerAffectation', am); })
        .then(function (x) { fin(x, 2); }).catch(function (x) { b.disabled = false; err(msgErr(x)); });
      return;
    }
    api('enregistrerAffectation', d).then(function (x) { fin(x, 1); }).catch(function (x) { b.disabled = false; err(msgErr(x)); });
  };
}

function chargerPlanning(sem) {
  S.semaine = lundi(sem);
  var semaine = S.semaine, c = S.semCache[semaine];
  if (c && c.pl && c.aff) { S.planning = c.pl; S.semAff = c.aff; rendrePlanning(); }
  else if (!S.planning || S.planning.semaine !== S.semaine) attentePlanning();
  var f = c && c.pl ? apiFond : api;
  Promise.all([f('getPlanning', semaine), f('getAffectations', semaine, ajout(semaine, 6))])
    .then(function (x) {
      var avant = JSON.stringify(S.semCache[semaine] || null);
      S.semCache[semaine] = { aff: x[1], pl: x[0] }; sauverCache();
      if (S.vue === 'planning' && S.plVue === 'horaires' && S.semaine === semaine && JSON.stringify(S.semCache[semaine]) !== avant) { S.planning = x[0]; S.semAff = x[1]; rendrePlanning(); }
    }).catch(echec);
}

}

    if (statut === 'Travail' && (!!d.pauseDebut !== !!d.pauseFin)) { $('#cErr').textContent = 'Indiquez le début et la fin de la pause, ou laissez les deux vides.'; return; }

    envoyer(d);
  };
}

/** Direction : qui a été prévenu, qui a vu, qui a décidé, quand ; et si la personne a vu la réponse. */
function traceConge(x) {
  if (!x.vues) return '';
  var l = ['Demandée le ' + esc(dHeure(x.demandeLe))];
  x.vues.forEach(function (v) {
    var n = esc(v.moi ? 'Moi' : v.nom);
    if (!v.vueLe && x.statut !== 'En attente') return; // demande déjà traitée : seules les vues réelles comptent
    l.push(v.vueLe ? '<span class="ok">Vue par ' + n + ' le ' + esc(dHeure(v.vueLe)) + '</span>' + (v.derniere && v.derniere !== v.vueLe ? ' · revue le ' + esc(dHeure(v.derniere)) : '')
      : '<span class="no">' + n + ' : pas encore vue</span>' + (v.notifieeLe ? ' · notifiée le ' + esc(dHeure(v.notifieeLe)) + ' (' + esc(v.canal) + ')' : ''));
  });
  if (x.traiteLe && x.statut !== 'En attente') l.push('<b>' + esc(x.statut) + '</b> par ' + esc(x.traitePar) + ' le ' + esc(dHeure(x.traiteLe)));
  if (x.statut === 'Acceptée' || x.statut === 'Refusée') l.push(x.reponseVueLe ? '<span class="ok">Réponse vue par ' + esc(x.nom) + ' le ' + esc(dHeure(x.reponseVueLe)) + '</span>' : '<span class="no">Réponse pas encore vue par ' + esc(x.nom) + '</span>');

  return '<div class="trc">' + l.join('<br>') + '</div>' + (j ? '<details><summary>Historique complet</summary>' + j + '</details>' : '');
}

    var mots = sansAcc(S.matQ).split(/\s+/).filter(String);
    var res = cat.filter(function (a) { var t = sansAcc(a.nom + ' ' + a.reference + ' ' + a.categorie + ' ' + a.sousCategorie + ' ' + a.fournisseur); return mots.every(function (m) { return t.indexOf(m) >= 0; }); });
    h += res.length ? '<div class="mc open"><div class="mc-b" style="border-top:0">' + res.slice(0, 150).map(function (a) { return rangeeArticle(a, true); }).join('') + '</div></div>' +
      (res.length > 150 ? '<div class="hint">' + res.length + ' résultats : précisez la recherche.</div>' : '')
      : '<div class="empty">Aucun produit ne correspond.</div>';
  } else {
    // grandes catégories › sous-catégories › produits
    var arbre = {}, cats = [];
    cat.forEach(function (a) {
      if (!arbre[a.categorie]) { arbre[a.categorie] = { sous: {}, ordre: [], n: 0 }; cats.push(a.categorie); }
      var c = arbre[a.categorie], sc = a.sousCategorie || '';
      if (!c.sous[sc]) { c.sous[sc] = []; c.ordre.push(sc); }
      c.sous[sc].push(a); c.n++;
    });
    var badges = function (l) {
      var nMoi = l.filter(function (a) { return coche(a.id); }).length;
      var nDem = l.filter(function (a) { return demandesArticle(a.id).some(function (d) { return d.statut === 'En attente' && d.email !== S.me.id; }); }).length;
      return (nMoi ? '<span class="pill p-fin">' + nMoi + ' coché' + (nMoi > 1 ? 's' : '') + '</span>' : '') + (nDem ? '<span class="pill p-att">' + nDem + ' demandé' + (nDem > 1 ? 's' : '') + '</span>' : '');
    };
    h += cats.map(function (c) {
      var n = arbre[c], ouvert = !!S.matOuvert[c], tous = [];
      n.ordre.forEach(function (sc) { tous = tous.concat(n.sous[sc]); });
      var corps = '';
      if (ouvert) {
        // les produits sans sous-catégorie d'abord, puis chaque sous-catégorie (repliable)
        n.ordre.slice().sort(function (a, b) { return !a ? -1 : !b ? 1 : a.localeCompare(b, 'fr'); }).forEach(function (sc) {
          var l = n.sous[sc];
          if (!sc) { corps += l.map(function (a) { return rangeeArticle(a); }).join(''); return; }
          var k = c + '›' + sc, o2 = !!S.matOuvert[k];
          corps += '<div class="ms' + (o2 ? ' open' : '') + '" data-c="' + esc(k) + '"><button class="ms-h"><span>' + esc(sc) + '</span>' + badges(l) + '<span class="nb">' + l.length + '</span>' + CHEV + '</button>' +
            (o2 ? '<div class="ms-b">' + l.map(function (a) { return rangeeArticle(a); }).join('') + '</div>' : '') + '</div>';
        });
      }
      return '<div class="mc' + (ouvert ? ' open' : '') + '" data-c="' + esc(c) + '"><button class="mc-h"><b>' + esc(c) + '</b>' + badges(tous) + '<span class="nb">' + n.n + '</span>' + CHEV + '</button>' +
        (ouvert ? '<div class="mc-b">' + corps + '</div>' : '') + '</div>';
    }).join('');
  }
  h += '<div style="margin-top:14px"><button class="lk" id="mLib">+ Demander un produit qui n’est pas dans la liste</button></div>';
  var ch = changementsSel(), nAtt = lignesAttente().length;
  h += '<div class="mbar">' + (ch.aj.length || ch.re.length
    ? '<div class="mbar2"><button class="btn" id="mAnn">Annuler</button><button class="btn pri" id="mVal">' + (ch.aj.length ? 'Ajouter ' + ch.aj.length + ' produit' + (ch.aj.length > 1 ? 's' : '') + ' à la commande' : '') + (ch.aj.length && ch.re.length ? ' · ' : '') + (ch.re.length ? 'retirer ' + ch.re.length : '') + '</button></div>'
    : '<button class="btn pri" id="mLst">Liste de commande' + (nAtt ? ' · ' + nAtt + ' produit' + (nAtt > 1 ? 's' : '') : '') + '</button>') + '</div>';
  var focus = document.activeElement && document.activeElement.id === 'mQ', pos = focus ? $('#mQ').selectionStart : 0;
  $('#main').innerHTML = h;
  if (focus) { $('#mQ').focus(); try { $('#mQ').setSelectionRange(pos, pos); } catch (e) { } }
  if (garder) window.scrollTo(0, y);
  brancherMateriel();
}

function brancherMateriel() {
  var q = $('#mQ');
  if (q) q.oninput = function () { S.matQ = q.value; clearTimeout(S.matRech); S.matRech = setTimeout(function () { rendreMateriel(); }, 150); };
  $$('.mc-h, .ms-h').forEach(function (b) {
    b.onclick = function () { var c = b.parentNode.getAttribute('data-c'); S.matOuvert[c] = !S.matOuvert[c]; rendreMateriel(true); };
  });
  $$('.ma-r').forEach(function (r) {
    var basculer = function (ev) {
      if (ev.target.closest('[data-ed]')) return;
      var id = r.getAttribute('data-a'); S.matSel[id] = !coche(id);
      if (S.matSel[id] === dejaMoi(id)) delete S.matSel[id];
      rendreMateriel(true);
    };
    r.onclick = basculer;
    r.onkeydown = function (ev) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); basculer(ev); } };
  });
  $$('[data-ed]').forEach(function (b) { b.onclick = function (ev) { ev.stopPropagation(); formArticle(S.mat.catalogue.filter(function (a) { return a.id === b.getAttribute('data-ed'); })[0]); }; });
  if ($('#mGer')) $('#mGer').onclick = gererCatalogue;
  if ($('#mAj1')) $('#mAj1').onclick = function () { formArticle(null); };
  $('#mLib').onclick = formHorsCatalogue;
  if ($('#mLst')) $('#mLst').onclick = listeCommande;
  if ($('#mAnn')) $('#mAnn').onclick = function () { S.matSel = {}; rendreMateriel(true); };
  if ($('#mVal')) $('#mVal').onclick = function () {
    var b = this, ch = changementsSel(); b.disabled = true;
    api('majSelectionMateriel', ch.aj, ch.re).then(function (r) {
      S.matSel = {}; appliquerMat(r);
      toast(ch.aj.length ? ch.aj.length + ' produit' + (ch.aj.length > 1 ? 's' : '') + ' ajouté' + (ch.aj.length > 1 ? 's' : '') + ' à la commande' : 'Demande mise à jour');
    }).catch(function (e) { b.disabled = false; echec(e); });
  };
}

function formHorsCatalogue() {
  S.matTiroir = null;
  tiroir('Article hors catalogue', '<div class="fld"><label for="hT">Article</label><input type="text" id="hT" placeholder="Nom, marque, référence si possible"></div>' +
    '<div class="fld"><label for="hN">Précision</label><input type="text" id="hN" placeholder="Facultatif (taille, couleur…)"></div><div class="err" id="hE"></div>',
    '<button class="btn" id="hA">Annuler</button><span class="sp"></span><button class="btn pri" id="hO">Ajouter à la liste</button>');
  $('#hA').onclick = fermer;
  $('#hO').onclick = function () {
    var b = this; b.disabled = true;
    api('demanderHorsCatalogue', $('#hT').value, 1, $('#hN').value).then(function (r) { fermer(); appliquerMat(r); toast('Ajouté à la liste de commande'); })
      .catch(function (e) { b.disabled = false; $('#hE').textContent = msgErr(e); });
  };
  setTimeout(function () { $('#hT').focus(); }, 50);
}

/** Liste de commande : ce qui est demandé (par fournisseur, avec qui et combien) et ce qui est commandé. */
function listeCommande() {
  S.matTiroir = listeCommande;
  var m = S.mat, att = m.enCours.filter(function (d) { return d.statut === 'En attente'; });
  var cmd = m.enCours.filter(function (d) { return d.statut === 'Commandée'; });
  var groupes = {}, ordre = [];
  att.forEach(function (d) { var f = d.fournisseur || ''; if (!groupes[f]) { groupes[f] = []; ordre.push(f); } groupes[f].push(d); });
  ordre.sort(function (a, b) { return !a ? 1 : !b ? -1 : a.localeCompare(b, 'fr'); });
  var lignes = function (l) {
    var par = {}, ord = [];
    l.forEach(function (d) { var k = d.article || 'l:' + sansAcc(d.libre); if (!par[k]) { par[k] = { d: d, q: 0, qui: [] }; ord.push(k); } par[k].q += d.quantite; par[k].qui.push(d); });
    return ord.map(function (k) { return par[k]; }).sort(function (a, b) { return a.d.categorie.localeCompare(b.d.categorie, 'fr') || a.d.nomArticle.localeCompare(b.d.nomArticle, 'fr'); });
  };
  var corps = '';
  if (!att.length) corps += '<div class="empty" style="padding:18px">Rien à commander pour l’instant.</div>';
  ordre.forEach(function (f) {
    var fo = (m.fournisseurs || []).filter(function (x) { return x.nom.toLowerCase() === f.toLowerCase(); })[0];
    var ls = lignes(groupes[f]);
    corps += '<div class="ml"><div class="ml-h"><b>' + esc(f || 'Fournisseur à préciser') + '</b><span class="meta">' + ls.length + ' article' + (ls.length > 1 ? 's' : '') + '</span></div>' +
      ls.map(function (x) {
        var d = x.d, det = [d.reference ? 'Réf. ' + d.reference : '', d.conditionnement].filter(String).join(' · ');
        var miens = x.qui.filter(function (y) { return y.email === S.me.id; });
        var annulables = d.article ? miens : x.qui.filter(function (y) { return y.email === S.me.id || m.gestion; });
        return '<div class="ml-r">' + (m.quantites ? '<span class="q">×' + x.q + '</span>' : '') + '<div style="flex:1;min-width:0"><b style="font-weight:600">' + esc(d.nomArticle) + '</b>' + (det ? '<div class="w">' + esc(det) + '</div>' : '') +
          '<div class="w">Demandé par ' + x.qui.map(function (y) { return esc(y.email === S.me.id ? 'moi' : y.nom) + (m.quantites ? ' ×' + y.quantite : '') + (y.note ? ' (' + esc(y.note) + ')' : '') + ' le ' + esc(dCourt(y.date)); }).join(' ; ') + '</div>' +
          (annulables.length ? '<div>' + annulables.map(function (y) { return '<button class="lk" style="font-size:12.5px" data-ret="' + esc(y.id) + '" data-art="' + esc(y.article) + '">Retirer' + (y.email === S.me.id ? ' ma demande' : ' la demande de ' + esc(y.nom)) + '</button>'; }).join(' · ') + '</div>' : '') +
          '</div></div>';
      }).join('') +
      (m.gestion ? '<div class="ml-a"><button class="btn sm" data-cop="' + esc(f) + '">Copier la liste</button>' +
        (fo && fo.email ? '<button class="btn sm pri" data-env="' + esc(f) + '">Envoyer au fournisseur</button>' : '') +
        '<button class="btn sm" data-cmd="' + esc(f) + '">Marquer commandée</button>' +
        (f && !(fo && fo.email) ? '<div class="hint" style="flex-basis:100%;margin:0">Pour l’envoyer directement, ajoutez l’e-mail du fournisseur (Catalogue › Fournisseurs).</div>' : '') + '</div>' : '') + '</div>';
  });
  if (cmd.length) {
    corps += '<div class="mg">Commandé, en attente de livraison</div>';
    var parCmd = {}, oc = [];
    cmd.forEach(function (d) { if (!parCmd[d.commande]) { parCmd[d.commande] = []; oc.push(d.commande); } parCmd[d.commande].push(d); });
    oc.forEach(function (c) {
      var l = parCmd[c], d0 = l[0];
      corps += '<div class="ml"><div class="ml-h"><b>' + esc(d0.fournisseur || 'Fournisseur à préciser') + '</b><span class="meta">commandé le ' + esc(dHeure(d0.commandeLe)) + (d0.commandePar ? ' par ' + esc(d0.commandePar) : '') + '</span></div>' +
        lignes(l).map(function (x) { return '<div class="ml-r">' + (m.quantites ? '<span class="q">×' + x.q + '</span>' : '') + '<div style="flex:1"><b style="font-weight:600">' + esc(x.d.nomArticle) + '</b><div class="w">Demandé par ' + x.qui.map(function (y) { return esc(y.email === S.me.id ? 'moi' : y.nom) + (m.quantites ? ' ×' + y.quantite : ''); }).join(', ') + '</div></div></div>'; }).join('') +
        (m.gestion ? '<div class="ml-a"><button class="btn sm ok" data-rec="' + esc(c) + '">Livraison reçue</button></div>' : '') + '</div>';
    });
  }
  if (m.gestion && m.commandes && m.commandes.some(function (c) { return c.statut === 'Reçue'; })) {
    corps += '<details style="margin-top:6px"><summary class="sec" style="cursor:pointer;margin:10px 0">Commandes reçues</summary>' +
      m.commandes.filter(function (c) { return c.statut === 'Reçue'; }).map(function (c) {
        return '<div class="hrow" style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)"><b>' + esc(c.fournisseur || 'Fournisseur à préciser') + '</b> · commandée le ' + esc(dHeure(c.date)) + ' par ' + esc(c.par) +
          (c.envoyeeA ? ' (envoyée à ' + esc(c.envoyeeA) + ')' : '') + ' · reçue le ' + esc(dHeure(c.recueLe)) + (c.recuePar ? ' par ' + esc(c.recuePar) : '') +
          '<div class="w" style="color:var(--ink3)">' + c.lignes.map(function (l) { return esc(l.nom) + (m.quantites ? ' ×' + l.quantite : ''); }).join(', ') + '</div></div>';
      }).join('') + '</details>';
  }
  var garde = $('#drb') && S.matListeOuverte ? $('#drb').scrollTop : 0;
  tiroir('Liste de commande', corps);
  S.matListeOuverte = true; S.matTiroir = listeCommande;
  if (garde) $('#drb').scrollTop = garde;
  $$('[data-ret]').forEach(function (b) {
    b.onclick = function () {
      b.disabled = true;
      var art = b.getAttribute('data-art');
      (art && b.textContent.indexOf('ma demande') >= 0 ? api('majSelectionMateriel', [], [art]) : api('annulerDemandeMateriel', b.getAttribute('data-ret')))
        .then(function (r) { appliquerMat(r); toast('Demande retirée'); }).catch(function (e) { b.disabled = false; echec(e); });
    };
  });
  $$('[data-cop]').forEach(function (b) { b.onclick = function () { copierTexte(texteCommande(b.getAttribute('data-cop'), lignes(groupes[b.getAttribute('data-cop')]))); }; });
  $$('[data-cmd]').forEach(function (b) {
    b.onclick = function () {
      var f = b.getAttribute('data-cmd');
      if (!confirm('Marquer comme commandés les ' + lignes(groupes[f]).length + ' article(s) de « ' + (f || 'Fournisseur à préciser') + ' » ? (à utiliser si vous avez commandé par téléphone ou sur le site du fournisseur)')) return;
      b.disabled = true;
      api('passerCommande', f, false, '').then(function (r) { appliquerMat(r); toast('Marqué comme commandé'); }).catch(function (e) { b.disabled = false; echec(e); });
    };
  });
  $$('[data-env]').forEach(function (b) { b.onclick = function () { envoyerCommande(b.getAttribute('data-env'), lignes(groupes[b.getAttribute('data-env')])); }; });
  $$('[data-rec]').forEach(function (b) {
    b.onclick = function () { b.disabled = true; api('commandeRecue', b.getAttribute('data-rec')).then(function (r) { appliquerMat(r); toast('Livraison enregistrée'); }).catch(function (e) { b.disabled = false; echec(e); }); };
  });
}

function texteCommande(f, ls) {
  return 'Commande ' + (S.cfg.nomApp || '') + (f ? ' – ' + f : '') + '\n' + ls.map(function (x) {
    var d = x.d; return '- ' + [d.reference ? 'Réf. ' + d.reference : '', d.nomArticle, d.conditionnement].filter(String).join(' · ') + (S.mat.quantites ? ' : ' + x.q : '');
  }).join('\n');
}
function copierTexte(t) {
  var fin = function () { toast('Liste copiée'); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(fin, function () { secours(); });
  else secours();
  function secours() { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); fin(); } catch (e) { toast('Copie impossible', true); } a.remove(); }
}

function envoyerCommande(f, ls) {
  var fo = S.mat.fournisseurs.filter(function (x) { return x.nom.toLowerCase() === f.toLowerCase(); })[0];
  $('#modal').innerHTML = '<div class="modal"><div class="box" style="width:min(460px,100%)"><h1 style="font-size:18px;margin:0 0 6px">Envoyer la commande</h1>' +
    '<p class="hint" style="margin:0 0 10px">À <b>' + esc(fo.email) + '</b> (' + esc(f) + '), avec vous en copie. ' + ls.length + ' article(s).</p>' +
    '<div class="fld"><label for="eM">Message (facultatif)</label><textarea id="eM" placeholder="Par exemple : livraison souhaitée avant jeudi"></textarea></div>' +
    '<div class="err" id="eE"></div><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" id="eA">Annuler</button><button class="btn pri" id="eO">Envoyer</button></div></div></div>';
  $('#eA').onclick = function () { $('#modal').innerHTML = ''; };
  $('#eO').onclick = function () {
    var b = this; b.disabled = true;
    api('passerCommande', f, true, $('#eM').value).then(function (r) { $('#modal').innerHTML = ''; appliquerMat(r); toast('Commande envoyée à ' + fo.email); })
      .catch(function (e) { b.disabled = false; $('#eE').textContent = msgErr(e); });
  };
}

/** Gestion du catalogue (personnes autorisées) : ajouter un article, fournisseurs. */
function gererCatalogue() {
  S.matTiroir = gererCatalogue;
  var f = S.mat.fournisseurs || [];
  var cats = {}; S.mat.catalogue.forEach(function (a) { cats[a.categorie] = (cats[a.categorie] || 0) + 1; });
  tiroir('Catalogue', '<p class="hint" style="margin-top:0">' + S.mat.catalogue.length + ' article(s) dans ' + Object.keys(cats).length + ' catégorie(s). Pour modifier un article, touchez « Modifier » sous son nom dans la liste.</p>' +
    '<button class="btn pri" id="gA">+ Ajouter un article</button>' +
    '<div class="sec">Fournisseurs</div>' +
    (f.length ? f.map(function (x, i) { return '<div class="ml-r" style="padding:8px 0"><div style="flex:1"><b style="font-weight:600">' + esc(x.nom) + '</b><div class="w">' + (x.email ? esc(x.email) : 'pas d’e-mail : la commande se copie ou se marque à la main') + '</div></div><button class="lk" data-fo="' + i + '">Modifier</button></div>'; }).join('') : '<p class="hint">Aucun fournisseur pour l’instant.</p>') +

function formArticle(a) {
  S.matTiroir = null;
  var cats = [], fos = [], scs = [];
  S.mat.catalogue.forEach(function (x) { if (cats.indexOf(x.categorie) < 0) cats.push(x.categorie); if (x.sousCategorie && scs.indexOf(x.sousCategorie) < 0) scs.push(x.sousCategorie); if (x.fournisseur && fos.indexOf(x.fournisseur) < 0) fos.push(x.fournisseur); });
  (S.mat.fournisseurs || []).forEach(function (x) { if (fos.indexOf(x.nom) < 0) fos.push(x.nom); });
  var v = a || { categorie: '', sousCategorie: '', nom: '', reference: '', fournisseur: '', conditionnement: '' };
  tiroir(a ? 'Modifier l’article' : 'Nouvel article',
    '<div class="fld"><label for="aC">Catégorie</label><input type="text" id="aC" list="lC" value="' + esc(v.categorie) + '" placeholder="Grande catégorie : par exemple Endodontie"><datalist id="lC">' + cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist></div>' +
    '<div class="fld"><label for="aS">Sous-catégorie</label><input type="text" id="aS" list="lS" value="' + esc(v.sousCategorie || '') + '" placeholder="Facultatif : par exemple Limes"><datalist id="lS">' + scs.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist></div>' +
    '<div class="fld"><label for="aN">Désignation</label><input type="text" id="aN" value="' + esc(v.nom) + '"></div>' +
    '<div class="two"><div class="fld"><label for="aR">Référence</label><input type="text" id="aR" value="' + esc(v.reference) + '"></div>' +
    '<div class="fld"><label for="aK">Conditionnement</label><input type="text" id="aK" value="' + esc(v.conditionnement) + '" placeholder="Boîte de 100…"></div></div>' +
    '<div class="fld"><label for="aF">Fournisseur</label><input type="text" id="aF" list="lF" value="' + esc(v.fournisseur) + '"><datalist id="lF">' + fos.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist></div>' +
    (a ? '<label class="perm"><input type="checkbox" id="aX"><span>Retirer du catalogue<small>L’article n’apparaît plus ; l’historique des commandes est conservé.</small></span></label>' : '') +
    '<div class="err" id="aE"></div>',
    '<button class="btn" id="aA">Annuler</button><span class="sp"></span><button class="btn pri" id="aO">Enregistrer</button>');
  $('#aA').onclick = fermer;
  $('#aO').onclick = function () {
    var b = this; b.disabled = true;
    api('enregistrerArticle', { id: a ? a.id : '', categorie: $('#aC').value, sousCategorie: $('#aS').value, nom: $('#aN').value, reference: $('#aR').value, conditionnement: $('#aK').value, fournisseur: $('#aF').value, actif: !(a && $('#aX').checked) })
      .then(function (r) { fermer(); appliquerMat(r); toast('Article enregistré'); }).catch(function (e) { b.disabled = false; $('#aE').textContent = msgErr(e); });
  };
}

function formFournisseur(x) {
  S.matTiroir = null;
  var v = x || { nom: '', email: '', note: '' };
  tiroir(x ? 'Fournisseur' : 'Nouveau fournisseur',
    '<div class="fld"><label for="fN">Nom</label><input type="text" id="fN" value="' + esc(v.nom) + '"' + (x ? ' readonly' : '') + '></div>' +
    '<div class="fld"><label for="fM">E-mail pour les commandes</label><input type="email" id="fM" value="' + esc(v.email) + '" placeholder="commandes@fournisseur.fr"></div>' +
    '<div class="fld"><label for="fT">Note</label><input type="text" id="fT" value="' + esc(v.note) + '" placeholder="N° client, contact…"></div><div class="err" id="fE"></div>',
    '<button class="btn" id="fA">Annuler</button><span class="sp"></span><button class="btn pri" id="fO">Enregistrer</button>');

/** Squelette de chargement : la forme approximative de ce qui va s'afficher, avec le message de lecture habituel. */
function sq(type, txt) {
  var l = function (w) { return '<i class="sq-l" style="width:' + w + '%"></i>'; };
  var cartes = function (n) { var h = ''; for (var k = 0; k < n; k++) h += '<div class="sq-card"><i class="sq-t"></i>' + l(80 - k * 7) + '<div style="margin-top:12px"><i class="sq-pill"></i><i class="sq-pill"></i></div></div>'; return h; };
  var lignes = function (n) { var h = ''; for (var k = 0; k < n; k++) h += '<i class="sq-tr"></i>'; return h; };
  var corps = type === 'stats' ? '<div class="sq-row sq-3"><i class="sq-k"></i><i class="sq-k"></i><i class="sq-k"></i></div>' + lignes(5)
    : type === 'table' ? lignes(7)
    : type === 'planning' ? '<div class="sq-row"><i class="sq-s" style="width:30%"></i></div><div class="sq-row"><i class="sq-c"></i><i class="sq-c"></i><i class="sq-c"></i></div><div class="sq-row"><i class="sq-c"></i><i class="sq-c"></i><i class="sq-c"></i></div>'
    : type === 'pers' ? '<div class="sq-row sq-3"><i class="sq-k"></i><i class="sq-k"></i><i class="sq-k"></i></div>' + lignes(6)
    : type === 'mini' ? l(90) + l(70) + l(80)
    : type === 'cartes' ? '<div class="sq-row sq-3"><i class="sq-k"></i><i class="sq-k"></i><i class="sq-k"></i></div>' + cartes(3)
    : cartes(4);
  return '<div class="load sq sq-' + type + (type === 'mini' ? ' sq-mini' : '') + '" role="status" aria-live="polite">' + (txt ? '<span class="sq-txt">' + txt + '</span>' : '<span class="vh">Chargement…</span>') + corps + '</div>';
}
