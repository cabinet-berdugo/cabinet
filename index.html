// ── Éditeur d'affectation ──
function formAffectation(a, salleInit) {
  var r = S.aff, ed = !!a;
  a = a || { id: '', date: S.jour, dentiste: '', salle: salleInit || '', debut: S.cfg.creneaux.journee[0], fin: S.cfg.creneaux.journee[1], assistantes: [], note: '' };
  var choisisIds = a.assistantes.filter(function (y) { return !y.independante; }).map(function (y) { return y.cle; });
  var externes = a.assistantes.filter(function (y) { return y.independante; }).map(function (y) { return 'ext:' + y.nom; });
  var etages = [];
  r.salles.filter(function (s) { return s.active || s.id === a.salle; }).forEach(function (s) {
    var e = etages.filter(function (x) { return x.nom === s.etage; })[0];
    if (!e) { e = { nom: s.etage, s: [] }; etages.push(e); }
    e.s.push(s);
  });
  var optSalles = '<option value="">Salle à définir</option>' + etages.map(function (e) {

  }).join('');
  var optDent = '<option value="">Choisir…</option>' + r.dentistes.map(function (d) { return '<option value="' + esc(d.id) + '"' + (d.id === a.dentiste ? ' selected' : '') + '>' + esc(d.nom) + '</option>'; }).join('');
  var C = S.cfg.creneaux;
  var preset = a.debut === C.journee[0] && a.fin === C.journee[1] ? 'journee' : a.debut === C.matin[0] && a.fin === C.matin[1] ? 'matin' : a.debut === C.apresMidi[0] && a.fin === C.apresMidi[1] ? 'apresMidi' : 'autre';
  var corps =
    '<div class="two"><div class="fld"><label for="eD">Date</label><input type="date" id="eD" value="' + esc(a.date) + '"></div>' +
    '<div class="fld"><label for="eP">Praticien *</label><select id="eP">' + optDent + '</select></div></div>' +
    '<div class="fld"><label for="eS">Cabinet ou bloc</label><select id="eS">' + optSalles + '</select></div>' +
    '<div class="fld"><label>Créneau</label><div class="seg" id="eC">' +
    [['journee', 'Journée'], ['matin', 'Matin'], ['apresMidi', 'Après-midi'], ['autre', 'Autre']].map(function (x) { return '<button type="button" data-c="' + x[0] + '"' + (x[0] === preset ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('') +
    '</div><div class="two" style="margin-top:8px"><div><label for="eH1" class="sr">Début</label><input type="time" id="eH1" step="900" value="' + esc(a.debut) + '" aria-label="Début"></div><div><input type="time" id="eH2" step="900" value="' + esc(a.fin) + '" aria-label="Fin"></div></div>' +
    '<label class="chk2" id="eSplitL" style="margin-top:10px;font-size:14px;color:var(--ink)"><input type="checkbox" id="eSplit"> Assistante différente le matin et l’après-midi</label></div>' +
    '<div class="fld"><label id="eAL">Assistantes</label><div id="eA"></div><div class="chips" id="eX" style="margin-top:8px"></div>' +
    '<div class="indep"><input type="text" id="eI" maxlength="60" placeholder="Nom de l’indépendante (facultatif)" aria-label="Nom de l’assistante indépendante"><button type="button" class="btn sm" id="eIAdd">+ Assistante indépendante</button></div></div>' +
    '<div class="fld hidden" id="eB2"><label id="eAL2">Assistantes de l’après-midi</label><div id="eA2"></div><div class="chips" id="eX2" style="margin-top:8px"></div>' +
    '<div class="indep"><input type="text" id="eI2" maxlength="60" placeholder="Nom de l’indépendante (facultatif)" aria-label="Nom de l’assistante indépendante de l’après-midi"><button type="button" class="btn sm" id="eIAdd2">+ Assistante indépendante</button></div></div>' +
    '<div class="hint" style="margin:-6px 0 14px">Sans assistante, l’affectation apparaît « Assistante à affecter ». Une assistante déjà prévue ailleurs sur ce créneau reste sélectionnable (assistante partagée).</div>' +
    '<div class="fld"><label for="eN">Note</label><input type="text" id="eN" maxlength="200" placeholder="Chirurgie implantaire" value="' + esc(a.note || '') + '"></div>' +
    (ed && a.majParNom ? '<div class="hint">Modifié par ' + esc(a.majParNom) + (a.majLe ? ' le ' + esc(dHeure(a.majLe)) : '') + '</div>' : '') +
    '<div class="err" id="eErr"></div>';
  tiroir(ed ? 'Modifier l’affectation' : 'Nouvelle affectation', corps,
    (ed ? '<button class="btn ko" id="eDel">Supprimer</button><span class="sp"></span>' : '') + '<button class="btn" id="eAnn">Annuler</button><button class="btn pri" id="eOk">Enregistrer</button>');

  var dispoTexte = function (email) {
    var d = r.dispo[email + '|' + $('#eD').value];
    if (!d) return '';
    if (d.statut === 'Congé') return 'en congé';
    if (d.statut === 'Repos') return 'repos';
    return d.debut && d.fin ? hm(d.debut) + '–' + hm(d.fin) : '';
  };
  var choisis2 = [], externes2 = [];
  /** Sélecteur d'assistantes + indépendantes (utilisé une fois, ou deux fois pour matin / après-midi). */
  var bloc = function (suf, ids, ext) {
    var sel = null;
    var rendre = function () {
      if (!sel) sel = selecteurPersonnes($('#eA' + suf), { personnes: r.assistantes, choisis: ids, info: dispoTexte });
      else sel.redessiner();
      $('#eX' + suf).innerHTML = ext.map(function (k) {
        return '<span class="chip on ext">' + esc(k.slice(4)) + ' · indépendante <button type="button" class="x-ext" data-k="' + esc(k) + '" aria-label="Retirer ' + esc(k.slice(4)) + '">×</button></span>';
      }).join('');
      $$('#eX' + suf + ' .x-ext').forEach(function (b) { b.onclick = function () { ext.splice(ext.indexOf(b.getAttribute('data-k')), 1); rendre(); }; });
    };
    $('#eIAdd' + suf).onclick = function () {
      var n = $('#eI' + suf).value.trim().replace(/\|/g, ' ');
      if (!n) {
        // numérotation des indépendantes non identifiées, pour distinguer plusieurs présentes le même jour
        var pris = {};
        r.affectations.forEach(function (x) { if (x.date === $('#eD').value) x.assistantes.forEach(function (y) { if (y.independante) pris[y.nom] = 1; }); });
        externes.concat(externes2).forEach(function (k) { pris[k.slice(4)] = 1; });
        var i = 1; while (pris['Indépendante n°' + i]) i++;
        n = 'Indépendante n°' + i;
      }
      if (ext.indexOf('ext:' + n) < 0) ext.push('ext:' + n);
      $('#eI' + suf).value = ''; rendre();
    };
    $('#eI' + suf).onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('#eIAdd' + suf).click(); } };
    rendre();
    return rendre;
  };
  var rendreChips = bloc('', choisisIds, externes);
  var rendreChips2 = null;
  var majSplit = function () {
    var possible = $('#eH1').value && $('#eH2').value && $('#eH1').value < C.matin[1] && $('#eH2').value > C.apresMidi[0];
    $('#eSplitL').classList.toggle('hidden', !possible);
    if (!possible) $('#eSplit').checked = false;
    var on = $('#eSplit').checked;
    $('#eB2').classList.toggle('hidden', !on);
    $('#eAL').textContent = on ? 'Assistantes du matin (' + hm($('#eH1').value) + '–' + hm(C.matin[1]) + ')' : 'Assistantes';
    $('#eAL2').textContent = 'Assistantes de l’après-midi (' + hm(C.apresMidi[0]) + '–' + hm($('#eH2').value) + ')';
    if (on && !rendreChips2) {
      // l'après-midi démarre avec les mêmes assistantes que le matin : il suffit de changer celle qui diffère
      choisisIds.forEach(function (x) { choisis2.push(x); }); externes.forEach(function (x) { externes2.push(x); });
      rendreChips2 = bloc('2', choisis2, externes2);
    }
  };
  $('#eSplit').onchange = majSplit;
  majSplit();
  $('#eD').onchange = function () { rendreChips(); if (rendreChips2) rendreChips2(); };
  $$('#eC button').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-c');
      $$('#eC button').forEach(function (x) { x.classList.toggle('on', x === b); });
      if (C[k]) { $('#eH1').value = C[k][0]; $('#eH2').value = C[k][1]; } else $('#eH1').focus();
      majSplit();
    };
  });
  ['#eH1', '#eH2'].forEach(function (s) { $(s).oninput = function () { $$('#eC button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-c') === 'autre'); }); majSplit(); }; });
  $('#eAnn').onclick = fermer;
  if ($('#eDel')) $('#eDel').onclick = function () {
    if (!confirm('Supprimer cette affectation ? Les autres affectations ne changent pas.')) return;
    api('supprimerAffectation', a.id).then(function (x) { S.aff = x; fermer(); rendreJour(); toast('Affectation supprimée'); }).catch(echec);
  };
  $('#eOk').onclick = function () {
    var d = { id: a.id, date: $('#eD').value, dentiste: $('#eP').value, salle: $('#eS').value, debut: $('#eH1').value, fin: $('#eH2').value, assistantes: choisisIds.concat(externes), note: $('#eN').value.trim() };
    var err = function (m) { $('#eErr').textContent = m; };
    if (!d.date) return err('Indiquez la date.');
    if (!d.dentiste) return err('Choisissez le praticien.');
    if (!d.debut || !d.fin) return err('Indiquez l’heure de début et de fin.');
    if (d.fin <= d.debut) return err('L’heure de fin doit être après l’heure de début.');
    var b = this; b.disabled = true;
    var fin = function (x, n) {
      S.aff = x; S.jour = d.date; fermer(); rendreJour();
      var e = x.enregistre;
      if (e && (e.conflits.length || e.alertes.length)) toast('Enregistré, mais à vérifier : ' + (e.conflits[0] || e.alertes[0]), true);
      else toast(n > 1 ? 'Matin et après-midi enregistrés' : 'Affectation enregistrée');
    };
    if ($('#eSplit').checked) {
      // deux créneaux : le matin (même fiche si elle existait) puis l'après-midi (nouvelle fiche)
      var m = Object.assign({}, d, { fin: C.matin[1] });
      var am = Object.assign({}, d, { id: '', debut: C.apresMidi[0], assistantes: choisis2.concat(externes2) });
      api('enregistrerAffectation', m).then(function () { return api('enregistrerAffectation', am); })
        .then(function (x) { fin(x, 2); }).catch(function (x) { b.disabled = false; err(msgErr(x)); });
      return;
    }
    api('enregistrerAffectation', d).then(function (x) { fin(x, 1); }).catch(function (x) { b.disabled = false; err(msgErr(x)); });
  };
}

// ── Gestion des salles (direction) ──
function formSalles() {
  var liste = S.aff.salles.map(function (s) { return { id: s.id, nom: s.nom, etage: s.etage, active: s.active }; });
  var etages = function () { var v = {}; liste.forEach(function (s) { if (s.etage) v[s.etage] = 1; }); return Object.keys(v); };
  var rendre = function () {
    $('#slL').innerHTML = liste.map(function (s, i) {
      return '<div class="slr"><div class="slf"><input type="text" data-i="' + i + '" data-f="nom" value="' + esc(s.nom) + '" maxlength="60" aria-label="Nom de la salle"><input type="text" data-i="' + i + '" data-f="etage" value="' + esc(s.etage) + '" maxlength="60" list="slEt" placeholder="Étage" aria-label="Étage"></div>' +
        '<div class="slb"><label class="chk2"><input type="checkbox" data-i="' + i + '" data-f="active"' + (s.active ? ' checked' : '') + '> Active</label>' +
        '<button type="button" class="btn sm" data-up="' + i + '" aria-label="Monter"' + (i ? '' : ' disabled') + '>↑</button><button type="button" class="btn sm" data-dn="' + i + '" aria-label="Descendre"' + (i < liste.length - 1 ? '' : ' disabled') + '>↓</button></div></div>';
    }).join('') + '<datalist id="slEt">' + etages().map(function (e) { return '<option value="' + esc(e) + '">'; }).join('') + '</datalist>';
    $$('#slL input').forEach(function (x) {
      x.oninput = x.onchange = function () { var s = liste[+x.getAttribute('data-i')], f = x.getAttribute('data-f'); s[f] = f === 'active' ? x.checked : x.value; };
    });
    $$('[data-up]').forEach(function (b) { b.onclick = function () { var i = +b.getAttribute('data-up'); liste.splice(i - 1, 0, liste.splice(i, 1)[0]); rendre(); }; });
    $$('[data-dn]').forEach(function (b) { b.onclick = function () { var i = +b.getAttribute('data-dn'); liste.splice(i + 1, 0, liste.splice(i, 1)[0]); rendre(); }; });
  };
  tiroir('Salles du cabinet', '<p class="hint" style="margin-top:0">Renommez les salles, changez leur étage ou leur ordre. Une salle désactivée n’apparaît plus dans les choix, mais ses affectations passées sont conservées.</p><div id="slL"></div>' +
    '<button type="button" class="btn sm" id="slAdd" style="margin-top:10px">+ Ajouter une salle</button><div class="err" id="slErr"></div>',
    '<button class="btn" id="slAnn">Annuler</button><button class="btn pri" id="slOk">Enregistrer</button>');
  rendre();
  $('#slAdd').onclick = function () { liste.push({ id: '', nom: '', etage: (liste[liste.length - 1] || {}).etage || '', active: true }); rendre(); var x = $$('#slL input[data-f="nom"]'); x[x.length - 1].focus(); };
  $('#slAnn').onclick = fermer;
  $('#slOk').onclick = function () {
    if (liste.some(function (s) { return !String(s.nom).trim(); })) { $('#slErr').textContent = 'Chaque salle doit avoir un nom.'; return; }
    api('enregistrerSalles', liste).then(function () { fermer(); toast('Salles enregistrées'); chargerJour(S.jour); }).catch(function (e) { $('#slErr').textContent = msgErr(e); });
  };
}

// ── Horaires des assistantes (vue existante) ──
function chargerPlanning(sem) {
  S.semaine = lundi(sem);
  if (!S.planning || S.planning.semaine !== S.semaine) attentePlanning();
  Promise.all([api('getPlanning', S.semaine), api('getAffectations', S.semaine, ajout(S.semaine, 5))])
    .then(function (x) { S.planning = x[0]; S.semAff = x[1]; if (S.vue === 'planning' && S.plVue === 'horaires') rendrePlanning(); }).catch(echec);
}

function infoCase(p, email, i) {
  var j = p.jours[i];
  var cg = p.conges.filter(function (c) { return c.email === email && c.debut <= j && c.fin >= j; })[0];
  var c = p.creneaux.filter(function (x) { return x.email === email && x.jour === i; })[0];
  return { conge: cg, c: c };
}

function rendrePlanning() {
  var p = S.planning, moi = S.me.id;
  var ed = p.peutModifier;
  var titreSem = 'Semaine du ' + dCourt(p.jours[0]) + ' au ' + dCourt(p.jours[5]);
  var avecQui = function (email, j) {
    if (!S.semAff) return [];
    return S.semAff.affectations.filter(function (a) { return a.date === j && a.assistantes.some(function (y) { return y.cle === email; }); });
  };
  var h = enTetePlanning() + '<div class="wk"><button class="btn sm" id="wPrev" aria-label="Semaine précédente">‹</button><span class="nm">' + titreSem + '</span>' +
    '<button class="btn sm" id="wNext" aria-label="Semaine suivante">›</button><button class="btn sm" id="wNow">Cette semaine</button><span class="sp"></span>' +
    (ed ? '<button class="btn sm" id="wCopy">Copier la semaine précédente</button><button class="btn sm pri" id="wMail">Envoyer le planning</button>' : '') +
    '</div>';
  if (!p.personnes.length) {
    h += '<div class="empty">Aucune assistante n’est encore enregistrée. Ajoutez-les dans l’onglet « Utilisateurs » du Google Sheet avec le rôle « Assistante ».</div>';
  } else {
    h += '<div class="grid' + (ed ? ' ed' : '') + '"><table class="pl"><thead><tr><th></th>' +
      p.jours.map(function (j, i) { return '<th class="' + (j === S.today ? 'td' : '') + '">' + JOURS[i].slice(0, 3) + '. ' + dCourt(j) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      p.personnes.map(function (pers) {
        return '<tr class="' + (pers.id === moi ? 'me' : '') + '"><td class="nm">' + esc(pers.nom) + '</td>' +
          p.jours.map(function (j, i) {
            var x = infoCase(p, pers.id, i), inner, cls = 'cell';
            var aff = avecQui(pers.id, j).map(function (a) { return '<div class="a">' + esc(a.dentisteNom) + (a.salleNom ? ' · ' + esc(a.salleNom) : '') + '</div>'; }).join('');
            if (x.conge) { cls += ' cg'; inner = 'Congé' + (aff ? '<div class="s">Affectée malgré le congé :</div>' + aff : ''); }
            else if (!x.c) inner = (ed ? '<span class="plus">+</span>' : '<span style="color:var(--ink3)">—</span>') + aff;
            else if (x.c.statut === 'Repos') { cls += ' rep'; inner = 'Repos' + (aff ? '<div class="s">Affectée malgré le repos :</div>' + aff : ''); }
            else inner = '<div class="h">' + esc(hm(x.c.debut)) + ' – ' + esc(hm(x.c.fin)) + '</div>' + aff +
              (x.c.heuresSup ? '<div class="s">+' + esc(x.c.heuresSup) + ' sup</div>' : '') +
              (x.c.note ? '<div class="a" style="font-style:italic">' + esc(x.c.note) + '</div>' : '');
            return '<td><button class="' + cls + '" data-e="' + esc(pers.id) + '" data-i="' + i + '"' + (ed ? '' : ' tabindex="-1"') + '>' + inner + '</button></td>';
          }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="hint" style="margin-top:8px">' + (ed ? 'Cliquez sur une case pour saisir les horaires. ' : '') + 'Les praticiens et salles viennent des affectations (vue « Par salle »). Les congés acceptés s’affichent automatiquement.</div>';
  }
  $('#main').innerHTML = h;
  brancherEnTete();
  $('#wPrev').onclick = function () { chargerPlanning(ajout(S.semaine, -7)); };
  $('#wNext').onclick = function () { chargerPlanning(ajout(S.semaine, 7)); };
  $('#wNow').onclick = function () { chargerPlanning(S.today); };
  if (ed) {
    $('#wCopy').onclick = function () {
      api('copierSemainePrecedente', S.semaine).then(function (r) { S.planning = r; rendrePlanning(); toast(r.copies ? r.copies + ' créneau(x) copié(s) depuis la semaine précédente' : 'Rien à copier (cases déjà remplies ou semaine précédente vide)'); }).catch(echec);
    };
    $('#wMail').onclick = function () {
      if (!confirm('Envoyer par e-mail à chaque assistante ses horaires et ses praticiens, et à chaque praticien ses salles, pour la ' + titreSem.toLowerCase() + ' ?')) return;
      api('notifierPlanning', S.semaine).then(function (n) { toast(n + ' e-mail(s) envoyé(s)'); }).catch(echec);
    };
    $$('.pl .cell').forEach(function (b) { b.onclick = function () { editerCase(b.getAttribute('data-e'), Number(b.getAttribute('data-i'))); }; });
  }
}

function editerCase(email, i) {
  var p = S.planning, x = infoCase(p, email, i), c = x.c || { statut: 'Travail', debut: '09:00', fin: '18:00', avec: '', heuresSup: '', note: '' };
  var corps = '<p style="margin-top:0"><b>' + esc(nom(email)) + '</b> · ' + JOURS[i] + ' ' + dLong(p.jours[i]) + '</p>' +
    (x.conge ? '<p class="pill p-att" style="display:inline-block;margin-bottom:12px">Congé accepté ce jour</p>' : '') +
    '<div class="fld"><label>Type</label><div class="seg" id="cSt"><button data-s="Travail"' + (c.statut !== 'Repos' ? ' class="on"' : '') + '>Travail</button><button data-s="Repos"' + (c.statut === 'Repos' ? ' class="on"' : '') + '>Repos</button></div></div>' +
    '<div id="cTr"><div class="two"><div class="fld"><label for="cD">Début</label><input type="time" id="cD" value="' + esc(c.debut || '09:00') + '" step="900"></div>' +
    '<div class="fld"><label for="cF">Fin</label><input type="time" id="cF" value="' + esc(c.fin || '18:00') + '" step="900"></div></div>' +
    '<div class="fld"><label for="cH">Heures sup</label><input type="text" id="cH" placeholder="1h30" value="' + esc(c.heuresSup || '') + '"></div></div>' +
    '<div class="fld"><label for="cN">Note</label><input type="text" id="cN" maxlength="200" placeholder="Stérilisation le matin" value="' + esc(c.note || '') + '"></div>' +

  tiroir('Horaires', corps, (x.c ? '<button class="btn ko" id="cDel">Vider la case</button><span class="sp"></span>' : '') + '<button class="btn" id="cAnn">Annuler</button><button class="btn pri" id="cOk">Enregistrer</button>');
  var statut = c.statut === 'Repos' ? 'Repos' : 'Travail';
  var maj = function () { $$('#cSt button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-s') === statut); }); $('#cTr').classList.toggle('hidden', statut === 'Repos'); };
  maj();
  $$('#cSt button').forEach(function (b) { b.onclick = function () { statut = b.getAttribute('data-s'); maj(); }; });
  $('#cAnn').onclick = fermer;
  var envoyer = function (d) {
    api('enregistrerCreneau', S.semaine, email, i, d).then(function (r) { S.planning = r; fermer(); rendrePlanning(); }).catch(function (e) { $('#cErr').textContent = msgErr(e); });
  };
  if ($('#cDel')) $('#cDel').onclick = function () { envoyer({ effacer: true }); };
  $('#cOk').onclick = function () {
    var d = { statut: statut, debut: $('#cD').value, fin: $('#cF').value, avec: c.avec || '', heuresSup: $('#cH').value.trim(), note: $('#cN').value.trim() };
    if (statut === 'Travail' && (!d.debut || !d.fin)) { $('#cErr').textContent = 'Indiquez l’heure de début et de fin.'; return; }
    if (statut === 'Travail' && d.fin <= d.debut) { $('#cErr').textContent = 'L’heure de fin doit être après l’heure de début.'; return; }
    envoyer(d);
  };
}

// ───────── Gestion du personnel (administrateurs) ─────────
function chargerPersonnel() {
  if (!S.pers) $('#main').innerHTML = '<div class="ph"><div class="ph-t"><h1>Personnel</h1></div></div><div class="load"><div class="spin"></div></div>';
  api('getPersonnel').then(function (p) { S.pers = p; if (S.vue === 'personnel') rendrePersonnel(); }).catch(echec);
}
function rafraichirUsers() {
  return api('getInit').then(function (i) { S.users = i.users; }).catch(function () { });
}
function initiales2(p) { return ((p.prenom || '').charAt(0) + (p.nom || '').charAt(0) || (p.prenom || '?').slice(0, 2)).toUpperCase(); }

function rendrePersonnel() {
  var P = S.pers, q = (S.persQ || '').toLowerCase();
  var vis = P.personnes.filter(function (p) {
    if (p.archive && !S.persArch) return false;
    return !q || (p.nomAffiche + ' ' + p.email + ' ' + p.fonction).toLowerCase().indexOf(q) >= 0;
  });
  var nbArch = P.personnes.filter(function (p) { return p.archive; }).length;
  var h = '<div class="ph"><div class="ph-t"><h1>Personnel</h1><p class="ph-g">Les membres du cabinet, leur accès à l’application et leurs droits. Touchez un nom pour le modifier.</p></div><div class="ph-a"><button class="btn pri" id="pAdd">+ Ajouter un membre</button></div></div>' +

        '<div class="nm">' + esc(p.nomAffiche) + ' ' + etat + '</div><div class="mt">' + esc(p.role) + ' · ' + (p.email ? esc(p.email) + ' · ' + esc(p.compte) : '<i>pas d’adresse e-mail</i>') + '</div></div>' +

function fichePersonne(p) {
  var P = S.pers, nouveau = !p;
  p = p || { id: '', prenom: '', nom: '', fonction: '', role: '', email: '', actif: true, archive: false, permissions: {}, compte: '' };
  var perms = {};
  P.permissions.forEach(function (x) { perms[x.cle] = !!p.permissions[x.cle]; });
  var defauts = function (role) { var d = {}; (P.permissionsRole[role] || []).forEach(function (k) { d[k] = true; }); return d; };
  var opt = function (liste, v) { return '<option value="">Choisir…</option>' + liste.map(function (x) { return '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); };
  var corps =
    (nouveau ? '' : '<p class="meta" style="margin-top:0">Identifiant ' + esc(p.id.toUpperCase()) + ' · ' + esc(p.compte) + (p.connexion ? ' · dernière connexion le ' + esc(dHeure(p.connexion)) : '') + '</p>') +
    '<div class="two"><div class="fld"><label for="pPr">Prénom *</label><input type="text" id="pPr" maxlength="60" value="' + esc(p.prenom) + '"></div>' +
    '<div class="fld"><label for="pNo">Nom</label><input type="text" id="pNo" maxlength="60" value="' + esc(p.nom) + '"></div></div>' +
    '<div class="two"><div class="fld"><label for="pFo">Fonction *</label><select id="pFo">' + opt(P.fonctions, p.fonction) + '</select></div>' +
    '<div class="fld"><label for="pRo">Rôle *</label><select id="pRo">' + opt(P.roles, p.role) + '</select></div></div>' +
    '<div class="fld"><label for="pEm">Adresse e-mail (facultative)</label><input type="email" id="pEm" autocapitalize="none" inputmode="email" placeholder="prenom.nom@gmail.com" value="' + esc(p.email) + '">' +
    '<div class="hint">Nécessaire pour se connecter et recevoir les notifications. Modifier l’adresse ferme l’accès lié à l’ancienne.</div></div>' +
    '<label class="chk2" style="margin:4px 0 14px"><input type="checkbox" id="pAc"' + (p.actif ? ' checked' : '') + (p.archive ? ' disabled' : '') + '> Compte actif</label>' +
    '<div class="sec" style="margin-top:6px">Autorisations</div><div id="pPerms"></div>' +
    '<div class="hint">Cochées par défaut selon le rôle ; vous pouvez les ajuster pour cette personne.</div>' +
    '<div class="err" id="pErr"></div>' +
    (nouveau ? '' : '<div class="sec">Historique</div><div id="pHist"><div class="load" style="padding:16px"><div class="spin"></div></div></div>');
  var pied = (nouveau ? '' : '<button class="btn ' + (p.archive ? '' : 'ko') + '" id="pArc">' + (p.archive ? 'Restaurer' : 'Archiver') + '</button>' +
    (p.email && p.actif ? '<button class="btn" id="pInv">' + (p.invitation ? 'Renvoyer l’invitation' : 'Envoyer l’invitation') + '</button>' : '') +
    (p.email && p.id !== P.moi ? '<button class="btn" id="pRev">Déconnecter ses appareils</button>' : '') + '<span class="sp"></span>') +
    '<button class="btn" id="pAnn">Annuler</button><button class="btn pri" id="pOk">Enregistrer</button>';
  tiroir(nouveau ? 'Nouveau membre' : esc(p.nomAffiche), corps, pied);
  var dessinerPerms = function () {
    var d = defauts($('#pRo').value);
    $('#pPerms').innerHTML = P.permissions.map(function (x) {
      return '<label class="perm"><input type="checkbox" data-k="' + esc(x.cle) + '"' + (perms[x.cle] ? ' checked' : '') + '><span>' + esc(x.libelle) +
        '<small>' + (d[x.cle] ? 'Inclus dans le rôle' : 'Non inclus dans le rôle') + (perms[x.cle] !== !!d[x.cle] ? ' · personnalisé' : '') + '</small></span></label>';
    }).join('');
    $$('#pPerms input').forEach(function (c) { c.onchange = function () { perms[c.getAttribute('data-k')] = c.checked; dessinerPerms(); }; });
  };
  dessinerPerms();
  $('#pRo').onchange = function () { var d = defauts(this.value); P.permissions.forEach(function (x) { perms[x.cle] = !!d[x.cle]; }); dessinerPerms(); };
  $('#pFo').onchange = function () { if (!$('#pRo').value && P.roles.indexOf(this.value) >= 0) { $('#pRo').value = this.value; $('#pRo').onchange(); } };
  $('#pAnn').onclick = fermer;
  var enregistrer = function (confirmerDoublon) {
    var d = { id: p.id, prenom: $('#pPr').value.trim(), nom: $('#pNo').value.trim(), fonction: $('#pFo').value, role: $('#pRo').value, email: $('#pEm').value.trim(), actif: $('#pAc').checked, permissions: perms, confirmerDoublon: !!confirmerDoublon };
    var err = function (m) { $('#pErr').innerHTML = esc(m); };
    if (!d.prenom) return err('Indiquez le prénom.');
    if (!d.fonction) return err('Choisissez la fonction.');
    if (!d.role) return err('Choisissez le rôle.');
    if (d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return err('Cette adresse e-mail n’est pas valide.');
    apiSensible('enregistrerPersonne', d).then(function (r) {
      S.pers = r; fermer(); rendrePersonnel(); rafraichirUsers(); toast(nouveau ? 'Membre ajouté' : 'Fiche enregistrée');
    }).catch(function (e) {
      var m = msgErr(e);
      if (m.indexOf('DOUBLON:') === 0) {
        $('#pErr').innerHTML = esc(m.slice(8)) + ' <button class="lk" id="pForce">Créer quand même</button>';
        $('#pForce').onclick = function () { enregistrer(true); };
      } else err(m);
    });
  };
  $('#pOk').onclick = function () { enregistrer(false); };
  if ($('#pArc')) $('#pArc').onclick = function () {
    var arch = !p.archive;
    if (arch && !confirm('Archiver ' + p.nomAffiche + ' ? La personne n’apparaîtra plus dans les listes et ne pourra plus se connecter. Son historique est conservé.')) return;
    apiSensible('archiverPersonne', p.id, arch).then(function (r) { S.pers = r; fermer(); rendrePersonnel(); rafraichirUsers(); toast(arch ? 'Membre archivé' : 'Membre restauré'); }).catch(echec);
  };
  if ($('#pInv')) $('#pInv').onclick = function () {
    var b = this; b.disabled = true;
    api('envoyerInvitation', p.id).then(function (r) { S.pers = r; toast('Invitation envoyée à ' + p.email); b.textContent = 'Invitation envoyée'; }).catch(function (e) { b.disabled = false; echec(e); });
  };
  if ($('#pRev')) $('#pRev').onclick = function () {
    if (!confirm('Déconnecter ' + p.nomAffiche + ' de tous ses appareils ? Il faudra se reconnecter avec le mot de passe.')) return;
    apiSensible('revoquerSessions', p.id).then(function (m) { toast(m); }).catch(echec);
  };
  if (!nouveau) api('historiquePersonne', p.id).then(function (hst) {
    if (!$('#pHist')) return;
    var h = '<div class="meta" style="margin:4px 0 6px"><b>Tâches</b> (' + hst.taches.length + ')</div>' +
      (hst.taches.length ? hst.taches.slice(0, 15).map(function (t) {
        return '<div class="hrow" data-t="' + esc(t.id) + '"><span class="pill ' + clsStatut(t.statut) + '">' + esc(t.statut) + '</span> ' + esc(t.titre) + ' <span class="meta">· ' + esc(t.liens.join(', ')) + ' · ' + esc(dCourt(t.creeLe)) + '</span></div>';
      }).join('') : '<div class="no-t">Aucune tâche.</div>') +
      '<div class="meta" style="margin:12px 0 6px"><b>Affectations</b> (60 jours avant et après)</div>' +
      (hst.affectations.length ? hst.affectations.slice(0, 15).map(function (a) {
        return '<div class="hrow">' + esc(dJour(a.date)) + ' · ' + hm(a.debut) + '–' + hm(a.fin) + ' · ' + esc(a.salleNom || 'salle à définir') + ' · ' + esc(a.dentisteNom) + (a.assistantes.length ? ' avec ' + esc(a.assistantes.join(', ')) : '') + '</div>';
      }).join('') : '<div class="no-t">Aucune affectation.</div>') +
      (hst.conges.length ? '<div class="meta" style="margin:12px 0 6px"><b>Congés</b></div>' + hst.conges.map(function (c) { return '<div class="hrow">' + esc(periode(c)) + ' · ' + esc(c.statut) + '</div>'; }).join('') : '');
    $('#pHist').innerHTML = h;
    $$('#pHist [data-t]').forEach(function (r) { r.onclick = function () { ouvrirTache(r.getAttribute('data-t')); }; });
  }).catch(function (e) { if ($('#pHist')) $('#pHist').innerHTML = '<div class="err">' + esc(msgErr(e)) + '</div>'; });
}

// ───────── Congés ─────────
function rafraichirConges(silence) {
  return api('getConges').then(function (c) { S.conges = c; majCompteurs(); if (S.vue === 'conges') rendreConges(); }).catch(function (e) { if (!silence) echec(e); });
}

function pillConge(s) {
  var c = { 'En attente': 'p-att', 'Acceptée': 'p-fin', 'Refusée': 'p-late', 'Annulée': 'p-todo' }[s] || '';
  return '<span class="pill ' + c + '">' + esc(s) + '</span>';
}
function periode(c) { return c.debut === c.fin ? 'Le ' + dLong(c.debut) : 'Du ' + dLong(c.debut) + ' au ' + dLong(c.fin); }

/** Direction : qui a été prévenu, qui a vu, qui a décidé, quand ; et si la personne a vu la réponse. */
function traceConge(x) {
  if (!x.vues) return '';
  var l = ['Demandée le ' + esc(dHeure(x.demandeLe))];
  x.vues.forEach(function (v) {
    var n = esc(v.moi ? 'Moi' : v.nom);
    if (!v.vueLe && x.statut !== 'En attente') return; // demande déjà traitée : seules les vues réelles comptent
    l.push(v.vueLe ? '<span class="ok">Vue par ' + n + ' le ' + esc(dHeure(v.vueLe)) + '</span>' + (v.derniere && v.derniere !== v.vueLe ? ' · revue le ' + esc(dHeure(v.derniere)) : '')
      : '<span class="no">' + n + ' : pas encore vue</span>' + (v.notifieeLe ? ' · notifiée le ' + esc(dHeure(v.notifieeLe)) + ' (' + esc(v.canal) + ')' : ''));
  });
  if (x.traiteLe && x.statut !== 'En attente') l.push('<b>' + esc(x.statut) + '</b> par ' + esc(x.traitePar) + ' le ' + esc(dHeure(x.traiteLe)));
  if (x.statut === 'Acceptée' || x.statut === 'Refusée') l.push(x.reponseVueLe ? '<span class="ok">Réponse vue par ' + esc(x.nom) + ' le ' + esc(dHeure(x.reponseVueLe)) + '</span>' : '<span class="no">Réponse pas encore vue par ' + esc(x.nom) + '</span>');
  var j = (x.journal || []).map(function (e) { return '<div>' + esc(dHeure(e.date)) + ' — <b>' + esc(e.nom) + '</b> · ' + esc(e.action) + (e.detail ? ' : ' + esc(e.detail) : '') + '</div>'; }).join('');
  return '<div class="trc">' + l.join('<br>') + '</div>' + (j ? '<details><summary>Historique complet</summary>' + j + '</details>' : '');
}
/** L'écran des congés est affiché : on signale ce qui a été vu (une seule fois par passage). */
function signalerVuesConges() {
  var c = S.conges; if (!c || document.visibilityState !== 'visible' || S.vue !== 'conges') return;
  var ids = c.aValider.map(function (x) { return x.id; })
    .concat(c.miens.filter(function (x) { return x.statut === 'Acceptée' || x.statut === 'Refusée'; }).map(function (x) { return x.id; }))
    .filter(function (id) { return !(S.congesSignales || {})[id]; });
  if (!ids.length) return;
  S.congesSignales = S.congesSignales || {}; ids.forEach(function (id) { S.congesSignales[id] = 1; });
  api('vuConges', ids).catch(function () { ids.forEach(function (id) { delete S.congesSignales[id]; }); });
}

function rendreConges() {
  var c = S.conges;
  var h = '<div class="ph"><div class="ph-t"><h1>Congés</h1><p class="ph-g">' + (S.conges && S.conges.peutValider ? 'Les demandes à valider sont en haut. Vos propres demandes et l’historique suivent.' : 'Choisissez vos dates et envoyez la demande. Vous êtes prévenu dès qu’elle est acceptée ou refusée.') + '</p></div><div class="ph-a"><button class="btn pri" id="cgNv">+ Demander un congé</button></div></div>';
  if (!c) { $('#main').innerHTML = h + '<div class="load"><div class="spin"></div></div>'; $('#cgNv').onclick = formConge; return; }
  if (c.peutValider) {
    h += '<h2>À valider' + (c.aValider.length ? ' (' + c.aValider.length + ')' : '') + '</h2>' +
      (c.aValider.length ? c.aValider.map(function (x) {
        return '<div class="cg-c" data-id="' + esc(x.id) + '"><div class="t">' + esc(x.nom) + (x.fonction ? ' <span class="meta" style="font-weight:400">· ' + esc(x.fonction) + '</span>' : '') + '</div>' +
          '<div class="m" style="color:var(--ink);font-size:14px">' + esc(periode(x)) + (x.debut !== x.fin ? ' (inclus)' : '') + '</div>' +
          '<div class="m">' + joursOuvrables(x.debut, x.fin) + ' jour(s) hors dimanche · demandé le ' + esc(dCourt(x.demandeLe)) + '</div>' +
          (x.commentaire ? '<div class="m" style="margin-top:4px">« ' + esc(x.commentaire) + ' »</div>' : '') + traceConge(x) +
          '<div class="r"><button class="btn sm ok" data-d="Acceptée">Accepter</button><button class="btn sm ko" data-d="Refusée">Refuser</button>' +
          '<input type="text" class="hidden" placeholder="Motif du refus (envoyé à la personne)" style="flex:1;min-width:200px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px"></div></div>';
      }).join('') : '<div class="empty">Aucune demande en attente.</div>');
  }
  h += '<h2>Mes demandes</h2>' + (c.miens.length ? c.miens.map(function (x) {
    return '<div class="cg-c"><div class="row"><span class="t">' + esc(periode(x)) + '</span><span class="sp"></span>' + pillConge(x.statut) + '</div>' +
      '<div class="m">' + joursOuvrables(x.debut, x.fin) + ' jour(s) · demandée le ' + esc(dHeure(x.demandeLe)) + (x.traitePar && x.traiteLe ? ' · ' + (x.statut === 'Acceptée' ? 'acceptée' : x.statut === 'Refusée' ? 'refusée' : 'annulée') + ' par ' + esc(x.traitePar) + ' le ' + esc(dHeure(x.traiteLe)) : '') + '</div>' +
      (x.commentaire ? '<div class="m" style="margin-top:4px">« ' + esc(x.commentaire) + ' »</div>' : '') +
      (x.reponse ? '<div class="m" style="margin-top:4px">Réponse : ' + esc(x.reponse) + '</div>' : '') +
      (x.statut === 'En attente' ? '<div class="r"><button class="lk" data-ann="' + esc(x.id) + '">Annuler ma demande</button></div>' : '') + '</div>';
  }).join('') : '<div class="empty">Vous n’avez pas encore fait de demande.</div>');
  if (c.peutValider && c.equipe.length) {
    h += '<h2>Historique de l’équipe</h2>' + c.equipe.slice(0, 60).map(function (x) {
      return '<div class="cg-c"><div class="row"><span class="t">' + esc(x.nom) + ' · ' + esc(periode(x)) + '</span><span class="sp"></span>' + pillConge(x.statut) + '</div>' +
        '<div class="m">' + joursOuvrables(x.debut, x.fin) + ' jour(s)' + (x.commentaire ? ' · « ' + esc(x.commentaire) + ' »' : '') + (x.reponse ? ' · réponse : ' + esc(x.reponse) : '') + '</div>' + traceConge(x) +
        (x.statut === 'Acceptée' && x.fin >= S.today ? '<div class="r"><button class="lk" data-ann="' + esc(x.id) + '">Annuler ce congé</button></div>' : '') + '</div>';
    }).join('');
  }
  $('#main').innerHTML = h;
  $('#cgNv').onclick = formConge;
  signalerVuesConges();
  $$('.cg-c[data-id]').forEach(function (card) {
    var id = card.getAttribute('data-id'), motif = $('input', card);
    $$('[data-d]', card).forEach(function (b) {
      b.onclick = function () {
        var d = b.getAttribute('data-d');
        if (d === 'Refusée' && motif.classList.contains('hidden')) { motif.classList.remove('hidden'); motif.focus(); b.textContent = 'Confirmer le refus'; return; }
        $$('button', card).forEach(function (x) { x.disabled = true; });
        api('traiterConge', id, d, d === 'Refusée' ? motif.value.trim() : '').then(function (r) { S.conges = r; majCompteurs(); rendreConges(); toast(d === 'Acceptée' ? 'Congé accepté, la personne est prévenue' : 'Refus envoyé'); }).catch(function (e) { echec(e); rafraichirConges(); });
      };
    });
  });
  $$('[data-ann]').forEach(function (b) {
    b.onclick = function () {
      if (!confirm('Annuler cette demande de congé ?')) return;
      api('annulerConge', b.getAttribute('data-ann')).then(function (r) { S.conges = r; majCompteurs(); rendreConges(); toast('Demande annulée'); }).catch(echec);
    };
  });
}

function formConge() {
  var corps = '<div class="two"><div class="fld"><label for="gD">Du</label><input type="date" id="gD"></div><div class="fld"><label for="gF">Au (inclus)</label><input type="date" id="gF"></div></div>' +
    '<div class="fld"><label for="gC">Commentaire</label><textarea id="gC" placeholder="Facultatif"></textarea></div>' +
    '<div class="hint" id="gN"></div><div class="err" id="gErr"></div>';
  tiroir('Demande de congé', corps, '<button class="btn" id="gAnn">Annuler</button><button class="btn pri" id="gOk">Envoyer la demande</button>');
  var calc = function () {
    var a = $('#gD').value, b = $('#gF').value; $('#gErr').textContent = '';
    if (a && !b) { $('#gF').value = a; b = a; }
    $('#gN').textContent = a && b && b >= a ? joursOuvrables(a, b) + ' jour(s), dimanches exclus.' : '';
  };
  $('#gD').onchange = calc; $('#gF').onchange = calc;
  $('#gAnn').onclick = fermer;
  $('#gOk').onclick = function () {
    var d = { debut: $('#gD').value, fin: $('#gF').value, commentaire: $('#gC').value.trim() };

    if (d.fin < d.debut) { $('#gErr').textContent = 'La date de fin est avant la date de début.'; return; }
    var b = this; b.disabled = true;
    api('demanderConge', d).then(function (r) { S.conges = r; fermer(); majCompteurs(); rendreConges(); toast('Demande envoyée'); })
      .catch(function (e) { b.disabled = false; $('#gErr').textContent = msgErr(e); });
  };
}

S.matOuvert = {}; S.matQ = ''; S.matSel = {};
var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
function sansAcc(x) { return String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

document.addEventListener('visibilitychange', function () { if (K && S.me && S.vue === 'materiel' && document.visibilityState === 'visible') chargerMateriel(true); });
document.addEventListener('visibilitychange', function () { if (K && S.me && (S.vue === 'impayes' || S.vue === 'relances') && document.visibilityState === 'visible' && S.sv.data && !S.sv.data.erreur) chargerSuivi(true); });
function chargerMateriel(silence) {

/** Nouvelle réponse du serveur : on garde les quantités que l'utilisateur est en train de modifier. */
function appliquerMat(r) {

  if ($('#drawer').innerHTML && S.matTiroir) S.matTiroir();
}
function demandesArticle(id) { return S.mat.enCours.filter(function (d) { return d.article === id; }); }
/** Déjà demandé par moi (enregistré). */
function dejaMoi(id) { return S.mat.enCours.some(function (x) { return x.article === id && x.email === S.me.id && x.statut === 'En attente'; }); }
/** Coché à l'écran : ce qui est enregistré, modifié par mes clics pas encore validés. */
function coche(id) { return id in S.matSel ? S.matSel[id] : dejaMoi(id); }
function changementsSel() {
  var aj = [], re = [];
  Object.keys(S.matSel).forEach(function (id) { if (S.matSel[id] && !dejaMoi(id)) aj.push(id); else if (!S.matSel[id] && dejaMoi(id)) re.push(id); });
  return { aj: aj, re: re };
}
function lignesAttente() {
  if (!S.mat) return [];
  var vu = {};
  return S.mat.enCours.filter(function (d) { if (d.statut !== 'En attente') return false; var k = d.article || 'l:' + sansAcc(d.libre); if (vu[k]) return false; vu[k] = 1; return true; });
}

var COCHE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
function rangeeArticle(a, chemin) {
  var on = coche(a.id), dem = demandesArticle(a.id);
  var autres = dem.filter(function (d) { return d.statut === 'En attente' && d.email !== S.me.id; });
  var cmd = dem.filter(function (d) { return d.statut === 'Commandée'; });
  var det = [a.reference ? 'Réf. ' + a.reference : '', a.conditionnement].filter(String).join(' · ');
  var q = S.mat.quantites;
  return '<div class="ma-r' + (on ? ' sel' : '') + '" data-a="' + esc(a.id) + '" role="checkbox" aria-checked="' + on + '" tabindex="0"><span class="cb">' + COCHE_SVG + '</span><div class="ma-t">' +
    (chemin ? '<small class="ch">' + esc(a.categorie + (a.sousCategorie ? ' › ' + a.sousCategorie : '')) + '</small>' : '') +
    '<b>' + esc(a.nom) + '</b>' + (det ? '<small>' + esc(det) + '</small>' : '') +
    (autres.length ? '<div class="ma-o">Déjà demandé par ' + autres.map(function (d) { return esc(d.nom) + (q ? ' ×' + d.quantite : ''); }).join(', ') + '</div>' : '') +
    (cmd.length ? '<div class="ma-k">Commandé' + (cmd[0].commandeLe ? ' le ' + esc(dCourt(cmd[0].commandeLe)) : '') + ' · en attente de livraison</div>' : '') +
    (S.mat.gestion ? '<div class="ma-e"><button class="lk" data-ed="' + esc(a.id) + '">Modifier</button></div>' : '') +
    '</div></div>';
}

function rendreMateriel(garder) {
  var y = garder ? window.scrollY : 0;
  var h = '<div class="ph"><div class="ph-t"><h1>Matériel</h1><p class="ph-g">Cochez les produits dont vous avez besoin, puis validez en bas de l’écran. Ce que d’autres ont déjà demandé est signalé en orange.</p></div>' +
    (S.mat && S.mat.gestion ? '<div class="ph-a"><button class="btn" id="mGer">Gérer le catalogue</button></div>' : '') + '</div>';
  if (!S.mat) { $('#main').innerHTML = h + '<div class="load"><div class="spin"></div></div>'; return; }
  var cat = S.mat.catalogue;
  h += '<input class="mq" id="mQ" type="search" placeholder="Rechercher un produit ou une référence" value="' + esc(S.matQ) + '" autocomplete="off">';
  if (!cat.length) {
    h += '<div class="empty">Le catalogue est vide pour l’instant.' + (S.mat.gestion ? '<div style="margin-top:12px"><button class="btn pri" id="mAj1">+ Ajouter un article</button></div>' : '') + '</div>';
  } else if (S.matQ.trim()) {
    var mots = sansAcc(S.matQ).split(/\s+/).filter(String);
    var res = cat.filter(function (a) { var t = sansAcc(a.nom + ' ' + a.reference + ' ' + a.categorie + ' ' + a.sousCategorie + ' ' + a.fournisseur); return mots.every(function (m) { return t.indexOf(m) >= 0; }); });
    h += res.length ? '<div class="mc open"><div class="mc-b" style="border-top:0">' + res.slice(0, 150).map(function (a) { return rangeeArticle(a, true); }).join('') + '</div></div>' +
      (res.length > 150 ? '<div class="hint">' + res.length + ' résultats : précisez la recherche.</div>' : '')
      : '<div class="empty">Aucun produit ne correspond.</div>';
  } else {
    // grandes catégories › sous-catégories › produits
    var arbre = {}, cats = [];
    cat.forEach(function (a) {
      if (!arbre[a.categorie]) { arbre[a.categorie] = { sous: {}, ordre: [], n: 0 }; cats.push(a.categorie); }
      var c = arbre[a.categorie], sc = a.sousCategorie || '';
      if (!c.sous[sc]) { c.sous[sc] = []; c.ordre.push(sc); }
      c.sous[sc].push(a); c.n++;
    });
    var badges = function (l) {
      var nMoi = l.filter(function (a) { return coche(a.id); }).length;
      var nDem = l.filter(function (a) { return demandesArticle(a.id).some(function (d) { return d.statut === 'En attente' && d.email !== S.me.id; }); }).length;
      return (nMoi ? '<span class="pill p-fin">' + nMoi + ' coché' + (nMoi > 1 ? 's' : '') + '</span>' : '') + (nDem ? '<span class="pill p-att">' + nDem + ' demandé' + (nDem > 1 ? 's' : '') + '</span>' : '');
    };
    h += cats.map(function (c) {
      var n = arbre[c], ouvert = !!S.matOuvert[c], tous = [];
      n.ordre.forEach(function (sc) { tous = tous.concat(n.sous[sc]); });
      var corps = '';
      if (ouvert) {
        // les produits sans sous-catégorie d'abord, puis chaque sous-catégorie (repliable)
        n.ordre.slice().sort(function (a, b) { return !a ? -1 : !b ? 1 : a.localeCompare(b, 'fr'); }).forEach(function (sc) {
          var l = n.sous[sc];
          if (!sc) { corps += l.map(function (a) { return rangeeArticle(a); }).join(''); return; }
          var k = c + '›' + sc, o2 = !!S.matOuvert[k];
          corps += '<div class="ms' + (o2 ? ' open' : '') + '" data-c="' + esc(k) + '"><button class="ms-h"><span>' + esc(sc) + '</span>' + badges(l) + '<span class="nb">' + l.length + '</span>' + CHEV + '</button>' +
            (o2 ? '<div class="ms-b">' + l.map(function (a) { return rangeeArticle(a); }).join('') + '</div>' : '') + '</div>';
        });
      }
      return '<div class="mc' + (ouvert ? ' open' : '') + '" data-c="' + esc(c) + '"><button class="mc-h"><b>' + esc(c) + '</b>' + badges(tous) + '<span class="nb">' + n.n + '</span>' + CHEV + '</button>' +
        (ouvert ? '<div class="mc-b">' + corps + '</div>' : '') + '</div>';
    }).join('');
  }
  h += '<div style="margin-top:14px"><button class="lk" id="mLib">+ Demander un produit qui n’est pas dans la liste</button></div>';
  var ch = changementsSel(), nAtt = lignesAttente().length;
  h += '<div class="mbar">' + (ch.aj.length || ch.re.length
    ? '<div class="mbar2"><button class="btn" id="mAnn">Annuler</button><button class="btn pri" id="mVal">' + (ch.aj.length ? 'Ajouter ' + ch.aj.length + ' produit' + (ch.aj.length > 1 ? 's' : '') + ' à la commande' : '') + (ch.aj.length && ch.re.length ? ' · ' : '') + (ch.re.length ? 'retirer ' + ch.re.length : '') + '</button></div>'
    : '<button class="btn pri" id="mLst">Liste de commande' + (nAtt ? ' · ' + nAtt + ' produit' + (nAtt > 1 ? 's' : '') : '') + '</button>') + '</div>';
  var focus = document.activeElement && document.activeElement.id === 'mQ', pos = focus ? $('#mQ').selectionStart : 0;
  $('#main').innerHTML = h;
  if (focus) { $('#mQ').focus(); try { $('#mQ').setSelectionRange(pos, pos); } catch (e) { } }
  if (garder) window.scrollTo(0, y);
  brancherMateriel();
}

function brancherMateriel() {
  var q = $('#mQ');
  if (q) q.oninput = function () { S.matQ = q.value; clearTimeout(S.matRech); S.matRech = setTimeout(function () { rendreMateriel(); }, 150); };
  $$('.mc-h, .ms-h').forEach(function (b) {
    b.onclick = function () { var c = b.parentNode.getAttribute('data-c'); S.matOuvert[c] = !S.matOuvert[c]; rendreMateriel(true); };
  });
  $$('.ma-r').forEach(function (r) {
    var basculer = function (ev) {
      if (ev.target.closest('[data-ed]')) return;
      var id = r.getAttribute('data-a'); S.matSel[id] = !coche(id);
      if (S.matSel[id] === dejaMoi(id)) delete S.matSel[id];
      rendreMateriel(true);
    };
    r.onclick = basculer;
    r.onkeydown = function (ev) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); basculer(ev); } };
  });
  $$('[data-ed]').forEach(function (b) { b.onclick = function (ev) { ev.stopPropagation(); formArticle(S.mat.catalogue.filter(function (a) { return a.id === b.getAttribute('data-ed'); })[0]); }; });
  if ($('#mGer')) $('#mGer').onclick = gererCatalogue;
  if ($('#mAj1')) $('#mAj1').onclick = function () { formArticle(null); };
  $('#mLib').onclick = formHorsCatalogue;
  if ($('#mLst')) $('#mLst').onclick = listeCommande;
  if ($('#mAnn')) $('#mAnn').onclick = function () { S.matSel = {}; rendreMateriel(true); };
  if ($('#mVal')) $('#mVal').onclick = function () {
    var b = this, ch = changementsSel(); b.disabled = true;
    api('majSelectionMateriel', ch.aj, ch.re).then(function (r) {
      S.matSel = {}; appliquerMat(r);
      toast(ch.aj.length ? ch.aj.length + ' produit' + (ch.aj.length > 1 ? 's' : '') + ' ajouté' + (ch.aj.length > 1 ? 's' : '') + ' à la commande' : 'Demande mise à jour');
    }).catch(function (e) { b.disabled = false; echec(e); });
  };
}

function formHorsCatalogue() {
  S.matTiroir = null;
  tiroir('Article hors catalogue', '<div class="fld"><label for="hT">Article</label><input type="text" id="hT" placeholder="Nom, marque, référence si possible"></div>' +
    '<div class="fld"><label for="hN">Précision</label><input type="text" id="hN" placeholder="Facultatif (taille, couleur…)"></div><div class="err" id="hE"></div>',
    '<button class="btn" id="hA">Annuler</button><span class="sp"></span><button class="btn pri" id="hO">Ajouter à la liste</button>');
  $('#hA').onclick = fermer;
  $('#hO').onclick = function () {
    var b = this; b.disabled = true;
    api('demanderHorsCatalogue', $('#hT').value, 1, $('#hN').value).then(function (r) { fermer(); appliquerMat(r); toast('Ajouté à la liste de commande'); })
      .catch(function (e) { b.disabled = false; $('#hE').textContent = msgErr(e); });
  };
  setTimeout(function () { $('#hT').focus(); }, 50);
}

/** Liste de commande : ce qui est demandé (par fournisseur, avec qui et combien) et ce qui est commandé. */
function listeCommande() {
  S.matTiroir = listeCommande;
  var m = S.mat, att = m.enCours.filter(function (d) { return d.statut === 'En attente'; });
  var cmd = m.enCours.filter(function (d) { return d.statut === 'Commandée'; });
  var groupes = {}, ordre = [];
  att.forEach(function (d) { var f = d.fournisseur || ''; if (!groupes[f]) { groupes[f] = []; ordre.push(f); } groupes[f].push(d); });
  ordre.sort(function (a, b) { return !a ? 1 : !b ? -1 : a.localeCompare(b, 'fr'); });
  var lignes = function (l) {
    var par = {}, ord = [];
    l.forEach(function (d) { var k = d.article || 'l:' + sansAcc(d.libre); if (!par[k]) { par[k] = { d: d, q: 0, qui: [] }; ord.push(k); } par[k].q += d.quantite; par[k].qui.push(d); });
    return ord.map(function (k) { return par[k]; }).sort(function (a, b) { return a.d.categorie.localeCompare(b.d.categorie, 'fr') || a.d.nomArticle.localeCompare(b.d.nomArticle, 'fr'); });
  };
  var corps = '';
  if (!att.length) corps += '<div class="empty" style="padding:18px">Rien à commander pour l’instant.</div>';
  ordre.forEach(function (f) {
    var fo = (m.fournisseurs || []).filter(function (x) { return x.nom.toLowerCase() === f.toLowerCase(); })[0];
    var ls = lignes(groupes[f]);
    corps += '<div class="ml"><div class="ml-h"><b>' + esc(f || 'Fournisseur à préciser') + '</b><span class="meta">' + ls.length + ' article' + (ls.length > 1 ? 's' : '') + '</span></div>' +
      ls.map(function (x) {
        var d = x.d, det = [d.reference ? 'Réf. ' + d.reference : '', d.conditionnement].filter(String).join(' · ');
        var miens = x.qui.filter(function (y) { return y.email === S.me.id; });
        var annulables = d.article ? miens : x.qui.filter(function (y) { return y.email === S.me.id || m.gestion; });
        return '<div class="ml-r">' + (m.quantites ? '<span class="q">×' + x.q + '</span>' : '') + '<div style="flex:1;min-width:0"><b style="font-weight:600">' + esc(d.nomArticle) + '</b>' + (det ? '<div class="w">' + esc(det) + '</div>' : '') +
          '<div class="w">Demandé par ' + x.qui.map(function (y) { return esc(y.email === S.me.id ? 'moi' : y.nom) + (m.quantites ? ' ×' + y.quantite : '') + (y.note ? ' (' + esc(y.note) + ')' : '') + ' le ' + esc(dCourt(y.date)); }).join(' ; ') + '</div>' +
          (annulables.length ? '<div>' + annulables.map(function (y) { return '<button class="lk" style="font-size:12.5px" data-ret="' + esc(y.id) + '" data-art="' + esc(y.article) + '">Retirer' + (y.email === S.me.id ? ' ma demande' : ' la demande de ' + esc(y.nom)) + '</button>'; }).join(' · ') + '</div>' : '') +
          '</div></div>';
      }).join('') +
      (m.gestion ? '<div class="ml-a"><button class="btn sm" data-cop="' + esc(f) + '">Copier la liste</button>' +
        (fo && fo.email ? '<button class="btn sm pri" data-env="' + esc(f) + '">Envoyer au fournisseur</button>' : '') +
        '<button class="btn sm" data-cmd="' + esc(f) + '">Marquer commandée</button>' +
        (f && !(fo && fo.email) ? '<div class="hint" style="flex-basis:100%;margin:0">Pour l’envoyer directement, ajoutez l’e-mail du fournisseur (Catalogue › Fournisseurs).</div>' : '') + '</div>' : '') + '</div>';
  });
  if (cmd.length) {
    corps += '<div class="mg">Commandé, en attente de livraison</div>';
    var parCmd = {}, oc = [];
    cmd.forEach(function (d) { if (!parCmd[d.commande]) { parCmd[d.commande] = []; oc.push(d.commande); } parCmd[d.commande].push(d); });
    oc.forEach(function (c) {
      var l = parCmd[c], d0 = l[0];
      corps += '<div class="ml"><div class="ml-h"><b>' + esc(d0.fournisseur || 'Fournisseur à préciser') + '</b><span class="meta">commandé le ' + esc(dHeure(d0.commandeLe)) + (d0.commandePar ? ' par ' + esc(d0.commandePar) : '') + '</span></div>' +
        lignes(l).map(function (x) { return '<div class="ml-r">' + (m.quantites ? '<span class="q">×' + x.q + '</span>' : '') + '<div style="flex:1"><b style="font-weight:600">' + esc(x.d.nomArticle) + '</b><div class="w">Demandé par ' + x.qui.map(function (y) { return esc(y.email === S.me.id ? 'moi' : y.nom) + (m.quantites ? ' ×' + y.quantite : ''); }).join(', ') + '</div></div></div>'; }).join('') +
        (m.gestion ? '<div class="ml-a"><button class="btn sm ok" data-rec="' + esc(c) + '">Livraison reçue</button></div>' : '') + '</div>';
    });
  }
  if (m.gestion && m.commandes && m.commandes.some(function (c) { return c.statut === 'Reçue'; })) {
    corps += '<details style="margin-top:6px"><summary class="sec" style="cursor:pointer;margin:10px 0">Commandes reçues</summary>' +
      m.commandes.filter(function (c) { return c.statut === 'Reçue'; }).map(function (c) {
        return '<div class="hrow" style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)"><b>' + esc(c.fournisseur || 'Fournisseur à préciser') + '</b> · commandée le ' + esc(dHeure(c.date)) + ' par ' + esc(c.par) +
          (c.envoyeeA ? ' (envoyée à ' + esc(c.envoyeeA) + ')' : '') + ' · reçue le ' + esc(dHeure(c.recueLe)) + (c.recuePar ? ' par ' + esc(c.recuePar) : '') +
          '<div class="w" style="color:var(--ink3)">' + c.lignes.map(function (l) { return esc(l.nom) + (m.quantites ? ' ×' + l.quantite : ''); }).join(', ') + '</div></div>';
      }).join('') + '</details>';
  }
  var garde = $('#drb') && S.matListeOuverte ? $('#drb').scrollTop : 0;
  tiroir('Liste de commande', corps);
  S.matListeOuverte = true; S.matTiroir = listeCommande;
  if (garde) $('#drb').scrollTop = garde;
  $$('[data-ret]').forEach(function (b) {
    b.onclick = function () {
      b.disabled = true;
      var art = b.getAttribute('data-art');
      (art && b.textContent.indexOf('ma demande') >= 0 ? api('majSelectionMateriel', [], [art]) : api('annulerDemandeMateriel', b.getAttribute('data-ret')))
        .then(function (r) { appliquerMat(r); toast('Demande retirée'); }).catch(function (e) { b.disabled = false; echec(e); });
    };
  });
  $$('[data-cop]').forEach(function (b) { b.onclick = function () { copierTexte(texteCommande(b.getAttribute('data-cop'), lignes(groupes[b.getAttribute('data-cop')]))); }; });
  $$('[data-cmd]').forEach(function (b) {
    b.onclick = function () {
      var f = b.getAttribute('data-cmd');
      if (!confirm('Marquer comme commandés les ' + lignes(groupes[f]).length + ' article(s) de « ' + (f || 'Fournisseur à préciser') + ' » ? (à utiliser si vous avez commandé par téléphone ou sur le site du fournisseur)')) return;
      b.disabled = true;
      api('passerCommande', f, false, '').then(function (r) { appliquerMat(r); toast('Marqué comme commandé'); }).catch(function (e) { b.disabled = false; echec(e); });
    };
  });
  $$('[data-env]').forEach(function (b) { b.onclick = function () { envoyerCommande(b.getAttribute('data-env'), lignes(groupes[b.getAttribute('data-env')])); }; });
  $$('[data-rec]').forEach(function (b) {
    b.onclick = function () { b.disabled = true; api('commandeRecue', b.getAttribute('data-rec')).then(function (r) { appliquerMat(r); toast('Livraison enregistrée'); }).catch(function (e) { b.disabled = false; echec(e); }); };
  });
}

function texteCommande(f, ls) {
  return 'Commande ' + (S.cfg.nomApp || '') + (f ? ' – ' + f : '') + '\n' + ls.map(function (x) {
    var d = x.d; return '- ' + [d.reference ? 'Réf. ' + d.reference : '', d.nomArticle, d.conditionnement].filter(String).join(' · ') + (S.mat.quantites ? ' : ' + x.q : '');
  }).join('\n');
}
function copierTexte(t) {
  var fin = function () { toast('Liste copiée'); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(fin, function () { secours(); });
  else secours();
  function secours() { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); fin(); } catch (e) { toast('Copie impossible', true); } a.remove(); }
}

function envoyerCommande(f, ls) {
  var fo = S.mat.fournisseurs.filter(function (x) { return x.nom.toLowerCase() === f.toLowerCase(); })[0];
  $('#modal').innerHTML = '<div class="modal"><div class="box" style="width:min(460px,100%)"><h1 style="font-size:18px;margin:0 0 6px">Envoyer la commande</h1>' +
    '<p class="hint" style="margin:0 0 10px">À <b>' + esc(fo.email) + '</b> (' + esc(f) + '), avec vous en copie. ' + ls.length + ' article(s).</p>' +
    '<div class="fld"><label for="eM">Message (facultatif)</label><textarea id="eM" placeholder="Par exemple : livraison souhaitée avant jeudi"></textarea></div>' +
    '<div class="err" id="eE"></div><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" id="eA">Annuler</button><button class="btn pri" id="eO">Envoyer</button></div></div></div>';
  $('#eA').onclick = function () { $('#modal').innerHTML = ''; };
  $('#eO').onclick = function () {
    var b = this; b.disabled = true;
    api('passerCommande', f, true, $('#eM').value).then(function (r) { $('#modal').innerHTML = ''; appliquerMat(r); toast('Commande envoyée à ' + fo.email); })
      .catch(function (e) { b.disabled = false; $('#eE').textContent = msgErr(e); });
  };
}

/** Gestion du catalogue (personnes autorisées) : ajouter un article, fournisseurs. */
function gererCatalogue() {
  S.matTiroir = gererCatalogue;
  var f = S.mat.fournisseurs || [];
  var cats = {}; S.mat.catalogue.forEach(function (a) { cats[a.categorie] = (cats[a.categorie] || 0) + 1; });
  tiroir('Catalogue', '<p class="hint" style="margin-top:0">' + S.mat.catalogue.length + ' article(s) dans ' + Object.keys(cats).length + ' catégorie(s). Pour modifier un article, touchez « Modifier » sous son nom dans la liste.</p>' +
    '<button class="btn pri" id="gA">+ Ajouter un article</button>' +
    '<div class="sec">Fournisseurs</div>' +
    (f.length ? f.map(function (x, i) { return '<div class="ml-r" style="padding:8px 0"><div style="flex:1"><b style="font-weight:600">' + esc(x.nom) + '</b><div class="w">' + (x.email ? esc(x.email) : 'pas d’e-mail : la commande se copie ou se marque à la main') + '</div></div><button class="lk" data-fo="' + i + '">Modifier</button></div>'; }).join('') : '<p class="hint">Aucun fournisseur pour l’instant.</p>') +
    '<div style="margin-top:10px"><button class="btn sm" id="gF">+ Ajouter un fournisseur</button></div>');
  $('#gA').onclick = function () { formArticle(null); };
  $('#gF').onclick = function () { formFournisseur(null); };
  $$('[data-fo]').forEach(function (b) { b.onclick = function () { formFournisseur(f[Number(b.getAttribute('data-fo'))]); }; });
}

function formArticle(a) {
  S.matTiroir = null;
  var cats = [], fos = [], scs = [];
  S.mat.catalogue.forEach(function (x) { if (cats.indexOf(x.categorie) < 0) cats.push(x.categorie); if (x.sousCategorie && scs.indexOf(x.sousCategorie) < 0) scs.push(x.sousCategorie); if (x.fournisseur && fos.indexOf(x.fournisseur) < 0) fos.push(x.fournisseur); });
  (S.mat.fournisseurs || []).forEach(function (x) { if (fos.indexOf(x.nom) < 0) fos.push(x.nom); });
  var v = a || { categorie: '', sousCategorie: '', nom: '', reference: '', fournisseur: '', conditionnement: '' };
  tiroir(a ? 'Modifier l’article' : 'Nouvel article',

      if (!confirm('Confirmer que ' + l.patient + ' a réglé ' + l.reste + ' ?')) return;
      var b = this; b.disabled = true;
      api('majImpaye', svPid(p), cle, 'regle', {}).then(function (r) { fermer(); appliquerSuivi(r); toast('Impayé marqué réglé'); }).catch(function (e) { b.disabled = false; $('#svE').textContent = msgErr(e); });
    };
    $('#svS').onclick = function () {
      var b = this; b.disabled = true;
      api('majImpaye', svPid(p), cle, 'modifier', { reste: $('#svRe').value, remarque: $('#svRm').value }).then(function (r) { fermer(); appliquerSuivi(r); toast('Impayé mis à jour'); }).catch(function (e) { b.disabled = false; $('#svE').textContent = msgErr(e); });
    };
  } else {
    var dt = function (id, lab, val) { return '<div class="fld"><label for="' + id + '">' + lab + '</label><div class="sv-dt"><input type="date" id="' + id + '" value="' + esc(val || '') + '"><button class="btn sm" type="button" data-auj="' + id + '">Aujourd’hui</button></div></div>'; };
    tiroir(esc(l.patient), info +
      '<div class="fld"><label for="svMt">Montant du devis</label><input type="text" id="svMt" inputmode="decimal" value="' + esc(l.nMontant ? String(l.nMontant).replace('.', ',') : '') + '" placeholder="0,00"></div>' +
      dt('svR1', 'Relance 1', l.r1) + dt('svR2', 'Relance 2', l.r2) + dt('svR3', 'Relance 3', l.r3) +
      '<div class="fld"><label for="svNo">Notes de relance</label><textarea id="svNo" placeholder="Ce que le patient a répondu…">' + esc(l.notes) + '</textarea></div><div class="err" id="svE"></div>' + histSuivi(l) +
      '<p class="hint">Enregistré dans « ' + esc(p.fichier) + ' » (colonnes saisies à la main, conservées à chaque mise à jour).</p>',
      '<button class="btn" id="svA">Annuler</button><span class="sp"></span><button class="btn pri" id="svS">Enregistrer</button>');
    $$('[data-auj]').forEach(function (b) { b.onclick = function () { $('#' + b.getAttribute('data-auj')).value = S.today; }; });
    $('#svS').onclick = function () {
      var b = this; b.disabled = true;
      api('majRelance', svPid(p), cle, { montant: $('#svMt').value, r1: $('#svR1').value, r2: $('#svR2').value, r3: $('#svR3').value, notes: $('#svNo').value })
        .then(function (r) { fermer(); appliquerSuivi(r); toast('Relance enregistrée'); }).catch(function (e) { b.disabled = false; $('#svE').textContent = msgErr(e); });
    };
  }
  $('#svA').onclick = fermer;
}

demarrer();
</script>
</body>
</html>
